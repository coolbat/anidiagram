</g>

  <text x="461.0" y="296.0" text-anchor="middle" fill="#283047">
<tspan x="461.0" dy="18" class="node-title">Think</tspan>
<tspan x="461.0" dy="17" class="node-caption">receive • process • resolve</tspan>
