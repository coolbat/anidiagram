      <line x1="52" y1="39" x2="52" y2="63" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="inner"/>
      <line x1="57" y1="45" x2="57" y2="57" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="inner"/>
