    <g data-part="waveform">
      <line x1="32" y1="48" x2="32" y2="54" stroke="var(--icon-detail, #64748b)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="inner"/>
      <line x1="37" y1="42" x2="37" y2="60" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="inner"/>
      <line x1="42" y1="36" x2="42" y2="66" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="inner"/>
