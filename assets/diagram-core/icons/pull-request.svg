<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" focusable="false" aria-label="Reviewed merge flow icon" data-icon="pull-request">
  <g data-part="body">
    <rect x="11" y="19" width="74" height="58" rx="18" fill="var(--icon-surface-main, #fffaf2)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
    <g data-part="source-path">
      <path d="M 20 34 H 31 Q 37 34 39 40" fill="none" stroke="var(--icon-accent, #7c5ce7)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
      <path d="M 20 62 H 31 Q 37 62 39 56" fill="none" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
      <circle cx="20" cy="34" r="3" fill="var(--icon-accent, #7c5ce7)"/>
      <circle cx="20" cy="62" r="3" fill="var(--icon-accent-secondary, #45c5bd)"/>
    </g>
    <g data-part="review">
      <rect x="36" y="35" width="25" height="27" rx="7" fill="var(--icon-surface-secondary, #eee9ff)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <circle cx="45" cy="46" r="4" fill="none" stroke="var(--icon-accent, #7c5ce7)" stroke-width="1.375" data-stroke-role="inner"/>
      <path d="M 51 45 H 56 M 42 54 H 56" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
    <g data-part="merge">
      <path d="M 61 48 H 69" fill="none" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
      <circle cx="65" cy="48" r="3" fill="var(--icon-accent-secondary, #45c5bd)"/>
    </g>
    <g data-part="target">
      <rect x="69" y="37" width="10" height="22" rx="5" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <circle cx="74" cy="48" r="2" fill="var(--icon-surface-main, #fffaf2)"/>
    </g>
    <g data-part="indicator">
      <circle cx="72" cy="70" r="5" fill="var(--icon-surface-contrast, #14213d)"/>
      <circle cx="72" cy="70" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
