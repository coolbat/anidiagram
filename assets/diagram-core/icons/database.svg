<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" focusable="false" aria-label="Database stacked storage icon" data-icon="database" data-icon-state="idle">
  <g data-part="shell">
    <rect x="20" y="18" width="56" height="66" rx="14" fill="var(--icon-surface-main, #fffaf2)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
  </g>
  <g data-part="top-ring">
    <ellipse cx="48" cy="24" rx="28" ry="8" fill="var(--icon-surface-secondary, #eef1f5)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
    <ellipse cx="48" cy="24" rx="18" ry="4.5" fill="none" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="1.375" data-stroke-role="inner"/>
  </g>
  <g data-part="layer-top">
    <path d="M 20.5 39 C 31 45 65 45 75.5 39" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
  <g data-part="layer-middle">
    <path d="M 20.5 51 C 31 57 65 57 75.5 51" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
  <g data-part="layer-bottom">
    <path d="M 24 78 C 34 81 62 81 72 78" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
  <g data-part="core">
    <circle cx="48" cy="65" r="9.6" fill="var(--icon-surface-secondary, #eef1f5)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
  </g>
  <g data-part="indicator">
    <circle cx="48" cy="65" r="6.7" fill="var(--icon-surface-contrast, #14213d)"/>
    <circle data-state-mark="idle" display="inline" cx="48" cy="65" r="2.2" fill="var(--icon-status-idle, #94a3b8)"/>
    <circle data-state-mark="active" display="none" cx="48" cy="65" r="3.8" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" data-stroke-role="inner"/>
    <g data-state-mark="processing" display="none">
      <path d="M 44.4 64 C 44.9 62.1 46.3 61.2 48 61.2" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
      <path d="M 51.6 66 C 51.1 67.9 49.7 68.8 48 68.8" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
    <path data-state-mark="success" display="none" d="M 43.9 65.2 L 46.9 68 L 52.1 62.2" fill="none" stroke="var(--icon-status-success, #35b66f)" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="inner"/>
    <polygon data-state-mark="warning" display="none" points="48,61.4 52,68.2 44,68.2" fill="none" stroke="var(--icon-status-warning, #f3a53a)" stroke-width="1.375" stroke-linejoin="round" data-stroke-role="inner"/>
    <path data-state-mark="error" display="none" d="M 44.5 61.5 L 51.5 68.5 M 51.5 61.5 L 44.5 68.5" fill="none" stroke="var(--icon-status-error, #e65b65)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
</svg>
