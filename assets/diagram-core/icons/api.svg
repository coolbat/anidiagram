      <path d="M 51.6 28.5 C 51.1 30.4 49.7 31.3 48 31.3" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
