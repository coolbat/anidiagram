  </g>
  <g data-part="header">
    <line x1="20.5" y1="36" x2="75.5" y2="36" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
  <g data-part="input-interface">
    <rect x="9.0625" y="43" width="14" height="10" rx="3" fill="var(--icon-surface-secondary, #eef1f5)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
  </g>
  <g data-part="output-interface">
