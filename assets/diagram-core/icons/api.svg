    <circle data-state-mark="active" display="none" cx="48" cy="27.5" r="3.8" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" data-stroke-role="inner"/>
    <g data-state-mark="processing" display="none">
