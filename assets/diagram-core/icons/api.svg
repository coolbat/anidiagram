    <circle cx="48" cy="56.5" r="6" fill="var(--icon-surface-recessed, #dfe5ec)" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" data-stroke-role="inner"/>
    <circle cx="48" cy="56.5" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
  </g>
  <g data-part="indicator-group">
