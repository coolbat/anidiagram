    <polygon data-state-mark="warning" display="none" points="48,23.9 52,30.7 44,30.7" fill="none" stroke="var(--icon-status-warning, #f3a53a)" stroke-width="1.375" stroke-linejoin="round" data-stroke-role="inner"/>
