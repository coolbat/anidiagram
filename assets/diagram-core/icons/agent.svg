    <rect data-detail="ear-right" x="73.5" y="38.5" width="6" height="13.5" rx="3" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
