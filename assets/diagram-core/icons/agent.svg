<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" focusable="false" aria-label="Agent robot icon" data-icon="agent" data-icon-state="idle">
  <g data-part="shell">
    <rect data-detail="ear-left" x="16.5" y="38.5" width="6" height="13.5" rx="3" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
    <rect data-detail="ear-right" x="73.5" y="38.5" width="6" height="13.5" rx="3" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
    <rect x="21" y="23.5" width="54" height="61" rx="20.5" fill="var(--icon-surface-main, #fffaf2)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
  </g>
  <g data-part="face-screen">
    <rect x="28" y="32.5" width="40" height="25" rx="9.5" fill="var(--icon-surface-contrast, #14213d)" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" data-stroke-role="inner"/>
  </g>
  <g data-part="eye-left">
    <rect x="36.5" y="41" width="4.5" height="7" rx="2.25" fill="var(--icon-accent-secondary, #45c5bd)"/>
  </g>
  <g data-part="eye-right">
    <rect x="55" y="41" width="4.5" height="7" rx="2.25" fill="var(--icon-accent-secondary, #45c5bd)"/>
  </g>
  <g data-part="mouth">
    <path d="M 43.5 49 Q 48 53.5 52.5 49" fill="none" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
  <g data-part="antenna">
    <line x1="48" y1="23.5" x2="48" y2="15.5" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    <circle cx="48" cy="12.5" r="3" fill="var(--icon-accent-secondary, #45c5bd)"/>
  </g>
  <g data-part="core">
    <circle cx="48" cy="69" r="9.6" fill="var(--icon-surface-secondary, #eef1f5)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
    <circle cx="48" cy="69" r="6.7" fill="var(--icon-surface-contrast, #14213d)"/>
  </g>
  <g data-part="indicator">
    <circle data-state-mark="idle" display="inline" cx="48" cy="69" r="2.2" fill="var(--icon-status-idle, #94a3b8)"/>
    <circle data-state-mark="active" display="none" cx="48" cy="69" r="3.8" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" data-stroke-role="inner"/>
    <g data-state-mark="processing" display="none">
      <path d="M 44.4 68 C 44.9 66.1 46.3 65.2 48 65.2 M 51.6 70 C 51.1 71.9 49.7 72.8 48 72.8" fill="none" stroke="var(--icon-status-active, #38bdf8)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
    <path data-state-mark="success" display="none" d="M 43.9 69.2 L 46.9 72 L 52.1 66.2" fill="none" stroke="var(--icon-status-success, #35b66f)" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="inner"/>
    <polygon data-state-mark="warning" display="none" points="48,65.4 52,72.2 44,72.2" fill="none" stroke="var(--icon-status-warning, #f3a53a)" stroke-width="1.375" stroke-linejoin="round" data-stroke-role="inner"/>
    <path data-state-mark="error" display="none" d="M 44.5 65.5 L 51.5 72.5 M 51.5 65.5 L 44.5 72.5" fill="none" stroke="var(--icon-status-error, #e65b65)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
  </g>
</svg>
