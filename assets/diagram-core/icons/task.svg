<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" focusable="false" aria-label="Work task card icon" data-icon="task">
  <g data-part="body">
    <g data-part="card">
      <rect x="16" y="23" width="64" height="56" rx="15" fill="var(--icon-surface-main, #fffaf2)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <rect x="23" y="33" width="50" height="34" rx="10" fill="var(--icon-surface-secondary, #eee9ff)" stroke="var(--icon-stroke, #14213d)" stroke-width="1.375" data-stroke-role="inner"/>
    </g>
    <g data-part="progress">
      <path d="M 32 57 H 64" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
      <path d="M 32 57 H 50" fill="none" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
    </g>
    <g data-part="check">
      <circle cx="48" cy="45" r="8" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="1.375" data-stroke-role="inner"/>
      <path d="M 44 45 L 47 48 L 53 42" fill="none" stroke="var(--icon-surface-main, #fffaf2)" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="inner"/>
    </g>
    <g data-part="handle">
      <path d="M 38 24 V 20 Q 38 16 42 16 H 54 Q 58 16 58 20 V 24" fill="var(--icon-surface-secondary, #eee9ff)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="outer"/>
    </g>
    <g data-part="indicator">
      <circle cx="72" cy="70" r="5" fill="var(--icon-surface-contrast, #14213d)"/>
      <circle cx="72" cy="70" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
    </g>
  </g>
</svg>
