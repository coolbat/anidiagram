<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" focusable="false" aria-label="Three stage delivery pipeline icon" data-icon="ci-cd">
  <g data-part="body">
    <g data-part="shell">
      <rect x="10" y="21" width="76" height="56" rx="18" fill="var(--icon-surface-main, #fffaf2)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <path d="M 22 30 H 74" fill="none" stroke="var(--icon-detail, #64748b)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
    <g data-part="build">
      <rect x="18" y="43" width="15" height="18" rx="5" fill="var(--icon-surface-secondary, #eee9ff)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <path d="M 22 49 H 29 M 22 55 H 29" fill="none" stroke="var(--icon-accent, #7c5ce7)" stroke-width="1.375" stroke-linecap="round" data-stroke-role="inner"/>
    </g>
    <g data-part="test">
      <circle cx="48" cy="52" r="10" fill="var(--icon-surface-secondary, #eee9ff)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <circle cx="48" cy="52" r="4.5" fill="var(--icon-accent-secondary, #45c5bd)" stroke="var(--icon-stroke, #14213d)" stroke-width="1.375" data-stroke-role="inner"/>
    </g>
    <g data-part="deploy">
      <rect x="63" y="41" width="16" height="21" rx="6" fill="var(--icon-accent, #7c5ce7)" stroke="var(--icon-stroke, #14213d)" stroke-width="2.125" data-stroke-role="outer"/>
      <path d="M 71 57 V 47 M 67 51 L 71 47 L 75 51" fill="none" stroke="var(--icon-surface-main, #fffaf2)" stroke-width="1.375" stroke-linecap="round" stroke-linejoin="round" data-stroke-role="inner"/>
    </g>
    <g data-part="progress">
      <path d="M 33 52 H 38 M 58 52 H 63" fill="none" stroke="var(--icon-accent-secondary, #45c5bd)" stroke-width="2.125" stroke-linecap="round" data-stroke-role="outer"/>
      <circle cx="37" cy="52" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
      <circle cx="59" cy="52" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
    </g>
    <g data-part="indicator">
      <circle cx="72" cy="70" r="5" fill="var(--icon-surface-contrast, #14213d)"/>
      <circle cx="72" cy="70" r="2.5" fill="var(--icon-accent-secondary, #45c5bd)"/>
    </g>
  </g>
</svg>
