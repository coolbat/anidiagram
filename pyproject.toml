[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anidiagram"
version = "0.2.0"
description = "Clean-room JSON-to-animated-SVG renderer for AniDiagram architecture visuals."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "AniDiagram contributors"}]

[project.optional-dependencies]
raster = ["Pillow>=9.0"]

[project.urls]
Homepage = "https://github.com/coolbat/anidiagram"
Repository = "https://github.com/coolbat/anidiagram"

[project.scripts]
anidiagram = "anidiagram.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
