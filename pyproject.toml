[project]
name = "anidiagram"
version = "0.1.0"
description = "Clean-room JSON-to-animated-SVG renderer for AniDiagram architecture visuals."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "AniDiagram contributors"}]

[project.scripts]
anidiagram = "anidiagram.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
