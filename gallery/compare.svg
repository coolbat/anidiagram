<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Compare</title>
<desc id="diagram-desc">two options with shared decision criteria</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#eeeeee" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#d4d4d4" stroke-width="1.4" />
<rect x="44" y="44" width="12" height="52" rx="6" fill="#10a37f" />
<rect x="72" y="46" width="360" height="56" rx="16" fill="#f4f7f6" />
<text id="main-title" x="90" y="84" class="title" fill="#111111">Compare</text>
<text x="74" y="126" class="subtitle" fill="#626262">two options with shared decision criteria</text>

<g id="group-left" class="group">
  <rect x="120.0" y="170.0" width="390.0" height="390.0" rx="22"
        fill="#fafafa" fill-opacity="0.34" stroke="#404040" stroke-width="1.6" stroke-dasharray="9 8" />
  <text x="138.0" y="200.0" class="group-label" fill="#626262">Option A</text>
</g>

<g id="group-right" class="group">
  <rect x="690.0" y="170.0" width="390.0" height="390.0" rx="22"
        fill="#effcf8" fill-opacity="0.34" stroke="#10a37f" stroke-width="1.6" stroke-dasharray="9 8" />
  <text x="708.0" y="200.0" class="group-label" fill="#626262">Option B</text>
</g>

<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#dc2626" />
  </marker>
</defs>
<g class="edge" data-role="risk">
  <path d="M 380.0 426.0 L 380.0 606.0 L 520.0 606.0" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow-1)" />
  <circle r="5" fill="#dc2626">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 380.0 426.0 L 380.0 606.0 L 520.0 606.0" begin="0.35s" />
  </circle>

  <text x="450.0" y="502.0" class="edge-label" fill="#626262">tradeoff</text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#dc2626" />
  </marker>
</defs>
<g class="edge" data-role="risk">
  <path d="M 790.0 426.0 L 790.0 606.0 L 680.0 606.0" fill="none" stroke="#dc2626" stroke-width="2.4" marker-end="url(#arrow-2)" />
  <circle r="5" fill="#dc2626">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 790.0 426.0 L 790.0 606.0 L 680.0 606.0" begin="0.70s" />
  </circle>

  <text x="735.0" y="502.0" class="edge-label" fill="#626262">tradeoff</text>
</g>

<g id="node-a-cost" class="node" data-role="process">
  <rect x="220.0" y="235.0" width="160.0" height="82.0" rx="8.0"
        fill="#fafafa" stroke="#404040" stroke-width="1.5" />

  <circle cx="238.0" cy="253.0" r="14" fill="#404040" />
  <text x="238.0" y="258.0" class="step-label" fill="#fafafa" text-anchor="middle">1</text>
  <text x="300.0" y="262.0" text-anchor="middle" fill="#111111">
<tspan x="300.0" dy="18" class="node-title">Cost</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-a-risk" class="node" data-role="risk">
  <rect x="220.0" y="385.0" width="160.0" height="82.0" rx="8.0"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />

  <circle cx="238.0" cy="403.0" r="14" fill="#dc2626" />
  <text x="238.0" y="408.0" class="step-label" fill="#fef2f2" text-anchor="middle">2</text>
  <text x="300.0" y="412.0" text-anchor="middle" fill="#111111">
<tspan x="300.0" dy="18" class="node-title">Risk</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-b-cost" class="node" data-role="agent">
  <rect x="790.0" y="235.0" width="160.0" height="82.0" rx="8.0"
        fill="#effcf8" stroke="#10a37f" stroke-width="1.5" />

  <circle cx="808.0" cy="253.0" r="14" fill="#10a37f" />
  <text x="808.0" y="258.0" class="step-label" fill="#effcf8" text-anchor="middle">3</text>
  <text x="870.0" y="262.0" text-anchor="middle" fill="#111111">
<tspan x="870.0" dy="18" class="node-title">Cost</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-b-risk" class="node" data-role="risk">
  <rect x="790.0" y="385.0" width="160.0" height="82.0" rx="8.0"
        fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />

  <circle cx="808.0" cy="403.0" r="14" fill="#dc2626" />
  <text x="808.0" y="408.0" class="step-label" fill="#fef2f2" text-anchor="middle">4</text>
  <text x="870.0" y="412.0" text-anchor="middle" fill="#111111">
<tspan x="870.0" dy="18" class="node-title">Risk</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-decision" class="node" data-role="output">
  <rect x="520.0" y="565.0" width="160.0" height="82.0" rx="8.0"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />

  <circle cx="538.0" cy="583.0" r="14" fill="#16a34a" />
  <text x="538.0" y="588.0" class="step-label" fill="#f0fdf4" text-anchor="middle">5</text>
  <text x="600.0" y="592.0" text-anchor="middle" fill="#111111">
<tspan x="600.0" dy="18" class="node-title">Decision</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>
</svg>
