<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Timeline</title>
  <style>
    body { margin: 0; background: #111827; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; gap: 12px; padding: 16px; box-sizing: border-box; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, a { border: 1px solid #475569; background: #1f2937; color: #f8fafc; border-radius: 8px; padding: 8px 10px; font: inherit; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #334155; }
    .stage { width: 100%; min-height: 0; overflow: hidden; border: 1px solid #334155; border-radius: 12px; background: #020617; cursor: grab; }
    .stage.dragging { cursor: grabbing; }
    .viewport { transform-origin: 0 0; width: max-content; }
    svg { display: block; max-width: none; height: auto; user-select: none; }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <button type="button" id="toggle">Pause</button>
      <button type="button" id="zoom-in">Zoom In</button>
      <button type="button" id="zoom-out">Zoom Out</button>
      <button type="button" id="reset">Reset</button>
      <a id="download" download="Timeline.svg">Download SVG</a>
    </div>
    <div class="stage" id="stage">
      <div class="viewport" id="viewport">
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Timeline</title>
<desc id="diagram-desc">milestones across a release window</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<rect width="100%" height="100%" fill="#07162c" />
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#12345c" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#2f6f9f" stroke-width="1.4" />
<rect x="44" y="44" width="12" height="52" rx="6" fill="#55c7ff" />
<rect x="72" y="46" width="360" height="56" rx="16" fill="#0d3b5c" />
<text id="main-title" x="90" y="84" class="title" fill="#e6f7ff">Timeline</text>
<text x="74" y="126" class="subtitle" fill="#9cc7e8">milestones across a release window</text>


<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 255.0 371.0 L 300.0 371.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-1)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 255.0 371.0 L 300.0 371.0" begin="0.35s" />
  </circle>

  <circle cx="255.5" cy="352.0" r="14" fill="#55c7ff" />
  <text x="255.5" y="357.0" class="step-label" fill="#ffffff" text-anchor="middle">1</text>
  <text x="277.5" y="357.0" class="edge-label" fill="#9cc7e8">milestone</text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 460.0 371.0 L 505.0 371.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-2)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 460.0 371.0 L 505.0 371.0" begin="0.70s" />
  </circle>

  <circle cx="460.5" cy="352.0" r="14" fill="#55c7ff" />
  <text x="460.5" y="357.0" class="step-label" fill="#ffffff" text-anchor="middle">2</text>
  <text x="482.5" y="357.0" class="edge-label" fill="#9cc7e8">milestone</text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 665.0 371.0 L 710.0 371.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-3)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 665.0 371.0 L 710.0 371.0" begin="1.05s" />
  </circle>

  <circle cx="665.5" cy="352.0" r="14" fill="#55c7ff" />
  <text x="665.5" y="357.0" class="step-label" fill="#ffffff" text-anchor="middle">3</text>
  <text x="687.5" y="357.0" class="edge-label" fill="#9cc7e8">milestone</text>
</g>

<defs>
  <marker id="arrow-4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 870.0 371.0 L 915.0 371.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-4)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 870.0 371.0 L 915.0 371.0" begin="1.40s" />
  </circle>

  <circle cx="870.5" cy="352.0" r="14" fill="#55c7ff" />
  <text x="870.5" y="357.0" class="step-label" fill="#ffffff" text-anchor="middle">4</text>
  <text x="892.5" y="357.0" class="edge-label" fill="#9cc7e8">milestone</text>
</g>

<g id="node-plan" class="node" data-role="source">
  <rect x="95.0" y="330.0" width="160.0" height="82.0" rx="8.0"
        fill="#0b273c" stroke="#7dd3fc" stroke-width="1.8" />

  <circle cx="113.0" cy="348.0" r="14" fill="#7dd3fc" />
  <text x="113.0" y="353.0" class="step-label" fill="#0b273c" text-anchor="middle">1</text>
  <text x="175.0" y="357.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="175.0" dy="18" class="node-title">Plan</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-build" class="node" data-role="process">
  <rect x="300.0" y="330.0" width="160.0" height="82.0" rx="8.0"
        fill="#0b1d38" stroke="#55c7ff" stroke-width="1.8" />

  <circle cx="318.0" cy="348.0" r="14" fill="#55c7ff" />
  <text x="318.0" y="353.0" class="step-label" fill="#0b1d38" text-anchor="middle">2</text>
  <text x="380.0" y="357.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="380.0" dy="18" class="node-title">Build</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-test" class="node" data-role="tool">
  <rect x="505.0" y="330.0" width="160.0" height="82.0" rx="8.0"
        fill="#1f2835" stroke="#f6d365" stroke-width="1.8" />

  <circle cx="523.0" cy="348.0" r="14" fill="#f6d365" />
  <text x="523.0" y="353.0" class="step-label" fill="#1f2835" text-anchor="middle">3</text>
  <text x="585.0" y="357.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="585.0" dy="18" class="node-title">Test</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-launch" class="node" data-role="output">
  <rect x="710.0" y="330.0" width="160.0" height="82.0" rx="8.0"
        fill="#0a2d33" stroke="#33e6a6" stroke-width="1.8" />

  <circle cx="728.0" cy="348.0" r="14" fill="#33e6a6" />
  <text x="728.0" y="353.0" class="step-label" fill="#0a2d33" text-anchor="middle">4</text>
  <text x="790.0" y="357.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="790.0" dy="18" class="node-title">Launch</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-learn" class="node" data-role="memory">
  <rect x="915.0" y="330.0" width="160.0" height="82.0" rx="8.0"
        fill="#0b2f2b" stroke="#33e6a6" stroke-width="1.8" />

  <circle cx="933.0" cy="348.0" r="14" fill="#33e6a6" />
  <text x="933.0" y="353.0" class="step-label" fill="#0b2f2b" text-anchor="middle">5</text>
  <text x="995.0" y="357.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="995.0" dy="18" class="node-title">Learn</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>
</svg>

      </div>
    </div>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const viewport = document.getElementById('viewport');
    const svg = viewport.querySelector('svg');
    const download = document.getElementById('download');
    let scale = 1;
    let x = 0;
    let y = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    function applyTransform() {
      viewport.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }
    function setDownload() {
      const blob = new Blob([new XMLSerializer().serializeToString(svg)], {type: 'image/svg+xml'});
      download.href = URL.createObjectURL(blob);
    }
    document.getElementById('toggle').addEventListener('click', (event) => {
      if (svg.animationsPaused && svg.animationsPaused()) {
        svg.unpauseAnimations();
        event.currentTarget.textContent = 'Pause';
      } else {
        svg.pauseAnimations();
        event.currentTarget.textContent = 'Play';
      }
    });
    document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.15); applyTransform(); });
    document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.35, scale - 0.15); applyTransform(); });
    document.getElementById('reset').addEventListener('click', () => { scale = 1; x = 0; y = 0; applyTransform(); });
    stage.addEventListener('pointerdown', (event) => { dragging = true; stage.classList.add('dragging'); lastX = event.clientX; lastY = event.clientY; stage.setPointerCapture(event.pointerId); });
    stage.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      x += event.clientX - lastX;
      y += event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      applyTransform();
    });
    stage.addEventListener('pointerup', () => { dragging = false; stage.classList.remove('dragging'); });
    setDownload();
  </script>
</body>
</html>
