           L 380.2 354.6
           L 377.8 357.0
           L 375.4 354.6
           Z"
        fill="#10a37f" stroke="#cbeee5" stroke-width="1.2" opacity="0" />


</g>

  <text x="446.4" y="343.0" text-anchor="middle" fill="#111111">
<tspan x="446.4" dy="18" class="node-title">Candidates</tspan>
<tspan x="446.4" dy="17" class="node-caption">outputs</tspan>
