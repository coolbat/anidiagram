                  fill="none" stroke="#0891b2" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />
          </g>
        </g>
      </g>
    </g>
  </g>


</g>

  <text x="226.4" y="343.0" text-anchor="middle" fill="#111111">
<tspan x="226.4" dy="18" class="node-title">Prompt</tspan>
<tspan x="226.4" dy="17" class="node-caption">task</tspan>
</text>
</g>

