  <circle id="icon-candidates-core" class="icon-runtime-part icon-agent-core" cx="369.6" cy="356.7" r="3.0"
        fill="#10a37f" stroke="#cbeee5" stroke-width="1.5" opacity="0.78" />
  <circle id="icon-candidates-thought-1" class="icon-runtime-part icon-agent-thought" cx="363.5" cy="349.5" r="2.0"
        fill="#10a37f" opacity="0.46" />
  <circle id="icon-candidates-thought-2" class="icon-runtime-part icon-agent-thought" cx="375.7" cy="351.6" r="1.9"
        fill="#10a37f" opacity="0.38" />
  <circle id="icon-candidates-thought-3" class="icon-runtime-part icon-agent-thought" cx="366.5" cy="363.1" r="1.8"
        fill="#10a37f" opacity="0.42" />
  <path id="icon-candidates-decision-token" class="icon-runtime-part icon-agent-decision-token"
