  <path id="icon-report-layer-2" d="M 797.4 364.1 C 803.1 368.2, 816.1 368.2, 821.8 364.1" class="semantic-icon semantic-icon-database" fill="none" stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.56" />
