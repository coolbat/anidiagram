<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc" data-motion-profile="subtle" data-motion-sequence="step-stagger" data-motion-edge="draw" data-motion-node="fade" data-motion-group="soft-reveal" data-motion-title="fade" data-motion-reduced="subtle">
<title id="diagram-title">Product Discovery Workflow</title>
<desc id="diagram-desc">research notes become a tested product decision</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: round; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .edge-arrow-particle { filter: url(#particle-glow); }
  .semantic-icon { vector-effect: non-scaling-stroke; }
  .semantic-icon-breathe { transform-box: fill-box; transform-origin: center; animation: semanticIconBreathe 2.8s ease-in-out infinite; }
  .icon-breathe-halo { pointer-events: none; filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @keyframes semanticIconBreathe { 0%, 100% { transform: scale(0.96); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight, .semantic-icon-breathe { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#ffffff" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#f3f4f6" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1224" height="668" rx="26" fill="none" stroke="#d1d5db" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#111827" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#f5f5f4" />

<text id="main-title" x="90" y="84" class="title" fill="#1f2937" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.08s" fill="freeze" />
  Product Discovery Workflow
</text>
<text x="74" y="126" class="subtitle" fill="#6b7280" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.28s" fill="freeze" />
  research notes become a tested product decision
</text>

<g id="group-research" class="group" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.70s" begin="0.17s" fill="freeze" />
  <rect x="70.0" y="215.0" width="450.0" height="180.0" rx="22"
        fill="#f0fdfa" fill-opacity="0.34" stroke="#0f766e" stroke-width="1.6" stroke-dasharray="9 8">
  </rect>


  <text x="88.0" y="245.0" class="group-label" fill="#6b7280">Research</text>
</g>

<g id="group-decision" class="group" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.70s" begin="0.29s" fill="freeze" />
  <rect x="520.0" y="215.0" width="635.0" height="180.0" rx="22"
        fill="#f9fafb" fill-opacity="0.34" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="9 8">
  </rect>


  <text x="538.0" y="245.0" class="group-label" fill="#6b7280">Decision</text>
</g>

<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#4b5563" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path class="edge-base" d="M 285.0 327.0 L 325.0 327.0" fill="none" stroke="#4b5563" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-1)" />
  <path class="edge-draw" d="M 285.0 327.0 L 325.0 327.0" fill="none" stroke="#4b5563" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-1)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.90s" begin="0.47s" fill="freeze" />
  </path>



  <text x="305.0" y="313.0" class="edge-label" fill="#6b7280" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.61s" fill="freeze" />
    next
  </text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#4b5563" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path class="edge-base" d="M 505.0 327.0 L 545.0 327.0" fill="none" stroke="#4b5563" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-2)" />
  <path class="edge-draw" d="M 505.0 327.0 L 545.0 327.0" fill="none" stroke="#4b5563" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-2)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.90s" begin="0.59s" fill="freeze" />
  </path>



  <text x="525.0" y="313.0" class="edge-label" fill="#6b7280" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.73s" fill="freeze" />
    next
  </text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#4b5563" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path class="edge-base" d="M 725.0 327.0 L 765.0 327.0" fill="none" stroke="#4b5563" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-3)" />
  <path class="edge-draw" d="M 725.0 327.0 L 765.0 327.0" fill="none" stroke="#4b5563" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-3)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.90s" begin="0.71s" fill="freeze" />
  </path>



  <text x="745.0" y="313.0" class="edge-label" fill="#6b7280" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.85s" fill="freeze" />
    next
  </text>
</g>

<defs>
  <marker id="arrow-4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#4b5563" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path class="edge-base" d="M 945.0 327.0 L 985.0 327.0" fill="none" stroke="#4b5563" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-4)" />
  <path class="edge-draw" d="M 945.0 327.0 L 985.0 327.0" fill="none" stroke="#4b5563" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-4)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.90s" begin="0.83s" fill="freeze" />
  </path>



  <text x="965.0" y="313.0" class="edge-label" fill="#6b7280" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.97s" fill="freeze" />
    next
  </text>
</g>

<g id="node-notes" class="node motion-node" data-role="source" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.25s" fill="freeze" />



  <rect x="105.0" y="285.0" width="180.0" height="84.0" rx="7.0"
        fill="#f0fdfa" stroke="#0f766e" stroke-width="1.4" />

<g id="icon-notes-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-file" data-icon="file" data-node-id="notes" opacity="0.94">




  <g class="semantic-icon-file-page icon-file-page-motion" opacity="0.96">


    <g transform="translate(144.6 327.0)">
      <g>

        <g transform="translate(-144.6 -327.0)">
          <path class="semantic-icon icon-filled semantic-icon-file icon-file-sheet"
                d="M 132.4 310.0 H 149.4 L 156.8 317.5 V 344.0 H 132.4 Z"
                fill="#cce7e4" stroke="#0f766e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <g class="icon-file-fold-motion">

            <path d="M 149.4 310.0 L 156.8 317.5 H 149.4 Z"
                  fill="#a2ceca" stroke="#0f766e" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M 149.4 310.0 V 317.5 H 156.8"
                  fill="none" stroke="#0f766e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />
          </g>
        </g>
      </g>
    </g>
  </g>


</g>

  <text x="221.4" y="313.0" text-anchor="middle" fill="#1f2937">
<tspan x="221.4" dy="18" class="node-title">Notes</tspan>
<tspan x="221.4" dy="17" class="node-caption">interviews</tspan>
</text>
</g>

<g id="node-patterns" class="node motion-node" data-role="memory" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.37s" fill="freeze" />



  <rect x="325.0" y="285.0" width="180.0" height="84.0" rx="7.0"
        fill="#f0fdf4" stroke="#15803d" stroke-width="1.4" />

<g id="icon-patterns-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-folder" data-icon="folder" data-node-id="patterns" opacity="0.94">




  <path class="semantic-icon icon-filled semantic-icon-folder icon-folder-body" d="M 347.6 318.8 H 360.9 L 364.6 313.7 H 381.6 V 340.9 H 347.6 Z"
        stroke="#15803d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#cde9d7" />


</g>

  <text x="441.4" y="313.0" text-anchor="middle" fill="#1f2937">
<tspan x="441.4" dy="18" class="node-title">Patterns</tspan>
<tspan x="441.4" dy="17" class="node-caption">cluster</tspan>
</text>
</g>

<g id="node-prototype" class="node motion-node" data-role="tool" opacity="0">
