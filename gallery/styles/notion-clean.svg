  <rect x="985.0" y="285.0" width="180.0" height="84.0" rx="7.0"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" />

<g id="icon-decision-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-output" data-icon="output" data-node-id="decision" opacity="0.94">




  <rect id="icon-decision-card" x="1011.3" y="314.8" width="22.4" height="23.1" rx="3.1"
        fill="#cdefd9" stroke="#16a34a" stroke-width="2.8" />
  <path id="icon-decision-line-1" class="icon-output-line" d="M 1017.5 322.2 H 1028.3"
        fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" opacity="0.82" />
  <path id="icon-decision-line-2" class="icon-output-line" d="M 1017.5 327.0 H 1026.3"
        fill="none" stroke="#16a34a" stroke-width="2.2" stroke-linecap="round" opacity="0.82" />
  <path id="icon-decision-check" class="icon-output-check" d="M 1019.5 332.8 L 1023.2 336.2 L 1031.4 327.7"
        fill="none" stroke="#16a34a" stroke-width="3.0" stroke-linecap="round" stroke-linejoin="round" />
  <circle id="icon-decision-flash" class="icon-runtime-part" cx="1028.0" cy="330.7" r="10.5" fill="none" stroke="#16a34a" stroke-width="2" opacity="0" />


</g>

  <text x="1101.4" y="313.0" text-anchor="middle" fill="#1f2937">
<tspan x="1101.4" dy="18" class="node-title">Decision</tspan>
<tspan x="1101.4" dy="17" class="node-caption">ship or</tspan>
<tspan x="1101.4" dy="17" class="node-caption">stop</tspan>
</text>
</g>
</svg>
