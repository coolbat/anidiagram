  <rect x="545.0" y="285.0" width="180.0" height="84.0" rx="7.0"
        fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" />

<g id="icon-prototype-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-tool" data-icon="tool" data-node-id="prototype" opacity="0.94">




  <rect id="icon-prototype-chip" x="569.6" y="317.5" width="24.8" height="19.0" rx="4.4"
        fill="#cfdefc" stroke="#2563eb" stroke-width="2.8" />
  <text id="icon-prototype-glyph" x="579.5" y="329.9" text-anchor="middle"
        fill="#2563eb" stroke="none" font-size="10.0" font-weight="800">fx</text>
  <circle id="icon-prototype-connector" cx="591.7" cy="327.0" r="2.2" fill="#2563eb" opacity="0.72" />
  <path id="icon-prototype-spark-1" class="icon-tool-spark" d="M 595.8 319.5 L 598.5 316.5"
        fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" opacity="0.84" />
  <path id="icon-prototype-spark-2" class="icon-tool-spark" d="M 596.5 333.5 L 599.9 335.8"
        fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" opacity="0.84" />
  <circle id="icon-prototype-flash" class="icon-runtime-part" cx="596.2" cy="327.0" r="6.8" fill="none" stroke="#2563eb" stroke-width="2" opacity="0" />


</g>

  <text x="661.4" y="313.0" text-anchor="middle" fill="#1f2937">
<tspan x="661.4" dy="18" class="node-title">Prototype</tspan>
<tspan x="661.4" dy="17" class="node-caption">try</tspan>
</text>
</g>

<g id="node-test" class="node motion-node" data-role="agent" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.61s" fill="freeze" />



  <rect x="765.0" y="285.0" width="180.0" height="84.0" rx="7.0"
        fill="#faf5ff" stroke="#7c3aed" stroke-width="1.4" />

<g id="icon-test-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-search" data-icon="search" data-node-id="test" opacity="0.94">




  <circle id="icon-test-lens" cx="801.9" cy="324.3" r="9.2" class="semantic-icon icon-filled semantic-icon-search" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="#e6d7fc" />
  <path id="icon-test-handle" d="M 809.7 332.1 L 820.2 342.6" class="semantic-icon semantic-icon-search" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  <path id="icon-test-scan" class="icon-runtime-part" d="M 794.1 319.5 L 808.0 331.8"
        fill="none" stroke="#7c3aed" stroke-width="2.8" stroke-linecap="round" opacity="0" />
  <circle id="icon-test-result-1" class="icon-runtime-part" cx="799.0" cy="323.3" r="2.2" fill="#7c3aed" opacity="0" />
  <circle id="icon-test-result-2" class="icon-runtime-part" cx="804.9" cy="326.7" r="1.9" fill="#7c3aed" opacity="0" />
  <circle id="icon-test-target" class="icon-runtime-part" cx="807.7" cy="323.6" r="3.7" fill="none" stroke="#7c3aed" stroke-width="2" opacity="0" />


</g>

  <text x="881.4" y="313.0" text-anchor="middle" fill="#1f2937">
<tspan x="881.4" dy="18" class="node-title">Test</tspan>
<tspan x="881.4" dy="17" class="node-caption">measure</tspan>
</text>
