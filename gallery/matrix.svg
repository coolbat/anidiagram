<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc" data-motion-profile="normal" data-motion-sequence="step-stagger" data-motion-edge="comet-flow" data-motion-node="glow-breathe" data-motion-group="marching-ants" data-motion-title="fade" data-motion-reduced="subtle">
<title id="diagram-title">Matrix</title>
<desc id="diagram-desc">two-by-two prioritization grid</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: round; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .edge-arrow-particle { filter: url(#particle-glow); }
  .semantic-icon { vector-effect: non-scaling-stroke; }
  .semantic-icon-breathe { transform-box: fill-box; transform-origin: center; animation: semanticIconBreathe 2.8s ease-in-out infinite; }
  .icon-breathe-halo { pointer-events: none; filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @keyframes semanticIconBreathe { 0%, 100% { transform: scale(0.96); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight, .semantic-icon-breathe { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#f8fafc" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e2e8f0" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#64748b" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#0ea5e9" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#e0f2fe" />

<text id="main-title" x="90" y="84" class="title" fill="#111827" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.08s" fill="freeze" />
  Matrix
</text>
<text x="74" y="126" class="subtitle" fill="#64748b" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.28s" fill="freeze" />
  two-by-two prioritization grid
</text>

<g id="group-matrix" class="group" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.70s" begin="0.17s" fill="freeze" />
  <rect x="250.0" y="155.0" width="700.0" height="440.0" rx="22"
        fill="#ffffff" fill-opacity="0.34" stroke="#64748b" stroke-width="1.6" stroke-dasharray="9 8">
    <animate attributeName="stroke-dashoffset" values="0;-34" dur="5.60s" begin="0.17s" repeatCount="indefinite" />
  </rect>


  <text x="268.0" y="185.0" class="group-label" fill="#64748b">Impact x Effort</text>
</g>


<g id="node-quick" class="node motion-node" data-role="output" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.25s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3.0;0 0;0 2.0;0 0" dur="5.85s" begin="0.95s"
        repeatCount="indefinite" additive="sum" />

  <circle class="node-burst" cx="410.0" cy="261.0" r="80.0" fill="none"
          stroke="#16a34a" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="80.0;115.2" dur="3.40s" begin="0.70s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.28;0" dur="3.40s" begin="0.70s" repeatCount="indefinite" />
  </circle>
  <circle class="node-burst" cx="410.0" cy="261.0" r="80.0" fill="none"
          stroke="#16a34a" stroke-width="1" opacity="0">
    <animate attributeName="r" values="80.0;134.4" dur="4.60s" begin="1.60s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.18;0" dur="4.60s" begin="1.60s" repeatCount="indefinite" />
  </circle>
  <rect class="node-glow" x="326.0" y="216.0" width="168.0" height="90.0" rx="14.0"
        fill="none" stroke="#16a34a" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.25s" begin="0.45s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.25s" begin="0.45s" repeatCount="indefinite" />
  </rect>
  <rect x="330.0" y="220.0" width="160.0" height="82.0" rx="10.0"
        fill="#dcfce7" stroke="#16a34a" stroke-width="2.0" />


  <circle cx="348.0" cy="238.0" r="14" fill="#16a34a" />
  <text x="348.0" y="243.0" class="step-label" fill="#dcfce7" text-anchor="middle">1</text>
  <text x="410.0" y="247.0" text-anchor="middle" fill="#111827">
<tspan x="410.0" dy="18" class="node-title">Quick Win</tspan>
</text>
</g>

<g id="node-major" class="node motion-node" data-role="agent" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.37s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3.0;0 0;0 2.0;0 0" dur="6.30s" begin="1.07s"
        repeatCount="indefinite" additive="sum" />

  <circle class="node-burst" cx="770.0" cy="261.0" r="80.0" fill="none"
          stroke="#9333ea" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="80.0;115.2" dur="3.40s" begin="0.82s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.28;0" dur="3.40s" begin="0.82s" repeatCount="indefinite" />
  </circle>
  <circle class="node-burst" cx="770.0" cy="261.0" r="80.0" fill="none"
          stroke="#9333ea" stroke-width="1" opacity="0">
    <animate attributeName="r" values="80.0;134.4" dur="4.60s" begin="1.72s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.18;0" dur="4.60s" begin="1.72s" repeatCount="indefinite" />
  </circle>
  <rect class="node-glow" x="686.0" y="216.0" width="168.0" height="90.0" rx="14.0"
        fill="none" stroke="#9333ea" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.60s" begin="0.57s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.60s" begin="0.57s" repeatCount="indefinite" />
  </rect>
  <rect x="690.0" y="220.0" width="160.0" height="82.0" rx="10.0"
        fill="#f3e8ff" stroke="#9333ea" stroke-width="2.0" />


  <circle cx="708.0" cy="238.0" r="14" fill="#9333ea" />
  <text x="708.0" y="243.0" class="step-label" fill="#f3e8ff" text-anchor="middle">2</text>
  <text x="770.0" y="247.0" text-anchor="middle" fill="#111827">
<tspan x="770.0" dy="18" class="node-title">Major Bet</tspan>
</text>
</g>

<g id="node-fill" class="node motion-node" data-role="tool" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.49s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3.0;0 0;0 2.0;0 0" dur="5.40s" begin="1.19s"
        repeatCount="indefinite" additive="sum" />

  <rect class="node-glow" x="326.0" y="426.0" width="168.0" height="90.0" rx="14.0"
        fill="none" stroke="#ca8a04" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.95s" begin="0.69s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.95s" begin="0.69s" repeatCount="indefinite" />
  </rect>
  <rect x="330.0" y="430.0" width="160.0" height="82.0" rx="10.0"
        fill="#fef3c7" stroke="#ca8a04" stroke-width="2.0" />


  <circle cx="348.0" cy="448.0" r="14" fill="#ca8a04" />
  <text x="348.0" y="453.0" class="step-label" fill="#fef3c7" text-anchor="middle">3</text>
  <text x="410.0" y="457.0" text-anchor="middle" fill="#111827">
<tspan x="410.0" dy="18" class="node-title">Fill-In</tspan>
</text>
</g>

<g id="node-avoid" class="node motion-node" data-role="risk" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.61s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3.0;0 0;0 2.0;0 0" dur="5.85s" begin="1.31s"
        repeatCount="indefinite" additive="sum" />

  <circle class="node-burst" cx="770.0" cy="471.0" r="80.0" fill="none"
          stroke="#dc2626" stroke-width="1.6" opacity="0">
    <animate attributeName="r" values="80.0;115.2" dur="3.40s" begin="1.06s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.28;0" dur="3.40s" begin="1.06s" repeatCount="indefinite" />
  </circle>
  <circle class="node-burst" cx="770.0" cy="471.0" r="80.0" fill="none"
          stroke="#dc2626" stroke-width="1" opacity="0">
    <animate attributeName="r" values="80.0;134.4" dur="4.60s" begin="1.96s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0;0.18;0" dur="4.60s" begin="1.96s" repeatCount="indefinite" />
  </circle>
  <rect class="node-glow" x="686.0" y="426.0" width="168.0" height="90.0" rx="14.0"
        fill="none" stroke="#dc2626" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="3.90s" begin="0.81s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="3.90s" begin="0.81s" repeatCount="indefinite" />
  </rect>
  <rect x="690.0" y="430.0" width="160.0" height="82.0" rx="10.0"
        fill="#fee2e2" stroke="#dc2626" stroke-width="2.0" />


  <circle cx="708.0" cy="448.0" r="14" fill="#dc2626" />
  <text x="708.0" y="453.0" class="step-label" fill="#fee2e2" text-anchor="middle">4</text>
  <text x="770.0" y="457.0" text-anchor="middle" fill="#111827">
<tspan x="770.0" dy="18" class="node-title">Avoid</tspan>
</text>
</g>
</svg>
