  <script>
(function () {
  function getManifest() {
    const el = document.getElementById("anidiagram-motion-manifest");
    if (!el) return null;
    try {
      return JSON.parse(el.textContent || "{}");
    } catch (error) {
      console.warn("AniDiagram runtime: invalid motion manifest", error);
      return null;
    }
  }

  function resolveParts(parts) {
    const resolved = Object.create(null);
    if (!isPlainObject(parts)) return null;
    let entries;
    try {
      entries = Object.entries(parts);
    } catch (error) {
      return null;
    }
    for (const [key, selector] of entries) {
      if (!isSafePartName(key) || typeof selector !== "string" || !selector) return null;
      let part;
      try {
        part = document.querySelector(selector);
      } catch (error) {
        return null;
      }
      if (!(part instanceof Element)) return null;
      resolved[key] = part;
    }
    return resolved;
  }

  function isSafePartName(name) {
    return typeof name === "string"
      && /^[a-z][A-Za-z0-9]*(?:-[a-z0-9]+)*$/.test(name)
      && !["constructor", "prototype", "__proto__"].includes(name);
  }

  function resolveIconInstanceRoot(iconConfig, parts) {
    if (!isPlainObject(iconConfig) || !parts) return null;
    const partElements = Object.values(parts);
    if (!partElements.length || partElements.some((part) => !(part instanceof Element))) return null;

    let explicitRoot = Object.prototype.hasOwnProperty.call(parts, "root") ? parts.root : null;
    if (Object.prototype.hasOwnProperty.call(iconConfig, "root")) {
      if (typeof iconConfig.root !== "string" || !iconConfig.root) return null;
      try {
        explicitRoot = document.querySelector(iconConfig.root);
      } catch (error) {
        return null;
      }
      if (!(explicitRoot instanceof Element)) return null;
    }

    const strictPresentation = iconConfig.presentation_profile === "showcase";
    if (strictPresentation) {
      const roots = partElements.map((part) => part.closest("[data-icon][data-icon-presentation]"));
      if (roots.some((root) => !(root instanceof Element))) return null;
      const uniqueRoots = new Set(roots);
      if (explicitRoot) uniqueRoots.add(explicitRoot);
      if (uniqueRoots.size !== 1) return null;
      const root = roots[0];
      if (root.getAttribute("data-icon") !== iconConfig.icon) return null;
      if (root.getAttribute("data-icon-presentation") !== iconConfig.presentation_profile) return null;
      if (partElements.some((part) => !root.contains(part))) return null;
      return root;
    }

    const root = explicitRoot || partElements[0].closest("[data-icon]");
    if (!(root instanceof Element)) return null;
    if (partElements.some((part) => !root.contains(part))) return null;
    if (root.hasAttribute("data-icon") && root.getAttribute("data-icon") !== iconConfig.icon) return null;
    return root;
  }

  function hasParts(parts, required) {
    return required.every((name) => Boolean(parts[name]));
  }

  function setInitial(parts, gsap) {
    Object.values(parts).forEach((part) => {
      if (part) {
        part.style.transformBox = "";
        if (part.dataset.restOpacity === undefined) {
          const opacity = Number(gsap.getProperty(part, "opacity"));
          part.dataset.restOpacity = String(Number.isFinite(opacity) ? opacity : 1);
        }
      }
    });
    gsap.set(Object.values(parts).filter(Boolean), { transformOrigin: "center center" });
  }

  function pathLengths(paths) {
    return new Map(paths.map((path) => [path, Math.max(1, path.getTotalLength ? path.getTotalLength() : 64)]));
  }

  function primeStrokeDraw(paths, gsap) {
    const lengths = pathLengths(paths);
    paths.forEach((path) => {
      const length = lengths.get(path);
      gsap.set(path, { strokeDasharray: length, strokeDashoffset: length });
    });
    return lengths;
  }

  function playIllustratedCommon(iconConfig, parts, gsap) {
    if (iconConfig.icon_system !== "illustrated-v1" && !parts.bubble) return null;
    const elements = [
      parts.bubble,
      parts.bubbleHalo,
      parts.wash,
      parts.accentMark,
      parts.sparkle,
      parts.orbitDot,
    ].filter(Boolean);
    if (!elements.length) return null;
    setInitial(parts, gsap);
    if (parts.accentMark && parts.accentMark.getTotalLength) {
      primeStrokeDraw([parts.accentMark], gsap);
    }
    gsap.set([parts.bubble, parts.wash].filter(Boolean), { transformOrigin: "center center" });
    gsap.set([parts.sparkle, parts.orbitDot].filter(Boolean), { transformOrigin: "center center" });
    if (parts.bubbleHalo) gsap.set(parts.bubbleHalo, { opacity: 0.16, scale: 0.84 });
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.25 });
    if (parts.bubble) {
      tl.to(parts.bubble, { scale: 1.045, duration: 0.28, ease: "sine.inOut" }, 0)
        .to(parts.bubble, { scale: 1, duration: 0.38, ease: "sine.inOut" }, 0.30);
    }
    if (parts.bubbleHalo) {
      tl.fromTo(parts.bubbleHalo, { opacity: 0.20, scale: 0.82 }, { opacity: 0, scale: 1.42, duration: 0.68, ease: "power2.out" }, 0.08);
    }
    if (parts.wash) {
      tl.to(parts.wash, { x: 1.5, y: -1.2, rotate: -2, duration: 0.46, ease: "sine.inOut" }, 0.12)
        .to(parts.wash, { x: 0, y: 0, rotate: 0, duration: 0.52, ease: "sine.inOut" }, 0.60);
    }
    if (parts.accentMark) {
      const length = parts.accentMark.getTotalLength ? parts.accentMark.getTotalLength() : 24;
      tl.fromTo(parts.accentMark, { strokeDashoffset: length, opacity: 0.1 }, { strokeDashoffset: 0, opacity: 0.62, duration: 0.28, ease: "power2.out" }, 0.18)
        .to(parts.accentMark, { opacity: 0.36, duration: 0.38 }, 0.88);
    }
    if (parts.sparkle) {
      tl.fromTo(parts.sparkle, { scale: 0.45, opacity: 0.2 }, { scale: 1.18, opacity: 0.95, duration: 0.18, ease: "back.out(3)" }, 0.34)
        .to(parts.sparkle, { scale: 0.86, opacity: 0.62, duration: 0.36, ease: "power2.out" }, 0.58);
    }
    if (parts.orbitDot) {
      tl.to(parts.orbitDot, {
        keyframes: [
          { x: 6, y: -3, duration: 0.24 },
          { x: 10, y: 5, duration: 0.24 },
          { x: 0, y: 0, duration: 0.32 },
        ],
        ease: "sine.inOut",
      }, 0.16);
    }
    return tl;
  }

  function playTokenIntent({ parts, gsap }) {
    const required = ["shell", "core", "tickLeft", "tickRight", "tickTop", "tickBottom", "halo"];
    if (!hasParts(parts, required)) return null;
    setInitial(parts, gsap);
    const ticks = [parts.tickLeft, parts.tickRight, parts.tickTop, parts.tickBottom];
    const lengths = primeStrokeDraw(ticks, gsap);
    gsap.set(parts.halo, { opacity: 0, scale: 0.6 });
    gsap.set(parts.core, { scale: 0.55, opacity: 0.35 });
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.55 });
    tl.fromTo(parts.shell, { scale: 0.82, rotate: -8, opacity: 0.72 }, { scale: 1, rotate: 0, opacity: 0.96, duration: 0.22, ease: "back.out(3)" })
      .to(parts.core, { scale: 1.35, opacity: 0.95, duration: 0.16, ease: "power2.out" }, "-=0.08")
      .to(parts.core, { scale: 1, opacity: 0.72, duration: 0.16, ease: "power2.inOut" })
      .fromTo(ticks, { strokeDashoffset: (index, target) => lengths.get(target), opacity: 0 }, { strokeDashoffset: 0, opacity: 0.86, duration: 0.18, stagger: 0.035, ease: "power2.out" }, "-=0.08")
      .fromTo(parts.halo, { opacity: 0.55, scale: 0.55 }, { opacity: 0, scale: 1.55, duration: 0.34, ease: "power2.out" }, "-=0.02")
      .to(parts.shell, { scale: 0.98, duration: 0.45, ease: "power2.inOut" }, 1.05)
      .to(ticks, { opacity: 0.56, duration: 0.45 }, 1.05);
    return tl;
  }

  function playToolRun({ parts, gsap }) {
    const required = ["chip", "glyph", "connector", "spark1", "spark2", "flash"];
    if (!hasParts(parts, required)) return null;
    setInitial(parts, gsap);
    const sparks = [parts.spark1, parts.spark2];
    const lengths = primeStrokeDraw(sparks, gsap);
    gsap.set(parts.flash, { opacity: 0, scale: 0.45 });
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.55 });
    tl.to(parts.chip, { y: 2, scale: 0.96, duration: 0.12, ease: "power2.in" })
      .to(parts.chip, { y: -1, scale: 1.04, duration: 0.18, ease: "back.out(3)" })
      .to(parts.chip, { y: 0, scale: 1, duration: 0.16, ease: "power2.out" })
      .fromTo(parts.glyph, { scale: 0.82, opacity: 0.6 }, { scale: 1.12, opacity: 1, duration: 0.16, ease: "back.out(3)" }, 0.10)
      .to(parts.glyph, { scale: 1, opacity: 0.92, duration: 0.18, ease: "power2.out" })
      .fromTo(parts.connector, { x: -6, opacity: 0.35, scale: 0.55 }, { x: 4, opacity: 0.95, scale: 1.1, duration: 0.22, ease: "power2.out" }, 0.22)
      .to(parts.connector, { x: 0, scale: 1, opacity: 0.72, duration: 0.18, ease: "power2.out" })
      .fromTo(sparks, { strokeDashoffset: (index, target) => lengths.get(target), opacity: 0 }, { strokeDashoffset: 0, opacity: 0.95, duration: 0.16, stagger: 0.045, ease: "power2.out" }, 0.42)
      .fromTo(parts.flash, { opacity: 0.62, scale: 0.45 }, { opacity: 0, scale: 1.6, duration: 0.26, ease: "power2.out" }, 0.48)
      .to(sparks, { opacity: 0.42, duration: 0.5 }, 0.92);
    return tl;
  }

  function playOutputReveal({ parts, gsap }) {
    const required = ["card", "line1", "line2", "check", "flash"];
    if (!hasParts(parts, required)) return null;
    setInitial(parts, gsap);
    const paths = [parts.line1, parts.line2, parts.check];
    const lengths = primeStrokeDraw(paths, gsap);
    gsap.set(parts.flash, { opacity: 0, scale: 0.45 });
    const tl = gsap.timeline({ repeat: -1, repeatDelay: 1.75 });
    tl.fromTo(parts.card, { y: 5, scale: 0.92, opacity: 0.75 }, { y: 0, scale: 1, opacity: 0.96, duration: 0.22, ease: "back.out(2.5)" })
      .fromTo([parts.line1, parts.line2], { strokeDashoffset: (index, target) => lengths.get(target), opacity: 0 }, { strokeDashoffset: 0, opacity: 0.86, duration: 0.22, stagger: 0.07, ease: "power2.out" }, 0.14)
      .fromTo(parts.check, { strokeDashoffset: lengths.get(parts.check), opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.26, ease: "power2.out" }, 0.42)
      .to(parts.card, { scale: 1.04, duration: 0.12, ease: "power2.out" }, 0.62)
      .to(parts.card, { scale: 1, duration: 0.18, ease: "power2.inOut" })
      .fromTo(parts.flash, { opacity: 0.65, scale: 0.5 }, { opacity: 0, scale: 1.65, duration: 0.28, ease: "power2.out" }, 0.58)
      .to([parts.line1, parts.line2, parts.check], { opacity: 0.68, duration: 0.55 }, 1.0);

  function playApiRequestResponse({ parts, gsap }) {

  const CHARACTER_REPEAT_DELAY = 0.8;
  const CHARACTER_IDLE_BREATHE_SCALE = 1.012;
  const STRONG_CHARACTER_REPEAT_DELAY = 0.28;
  const STRONG_CHARACTER_IDLE_BREATHE_SCALE = 1.028;

  function isStrongCharacter(config) {
    return config && config.performance_tier === "strong-loop";
  }

  function characterRepeatDelay(config) {
    return isStrongCharacter(config) ? STRONG_CHARACTER_REPEAT_DELAY : CHARACTER_REPEAT_DELAY;
  }

  function finishCharacterAtRest(tl, parts, restAt, config = null) {
    const targets = Object.entries(parts)
      .filter(([name, part]) => name !== "root" && Boolean(part))
      .map(([, part]) => part);
    const motionShell = parts.root && parts.root.querySelector(".illustrated-character-motion-shell");
    tl.set(targets, {
      opacity: (index, target) => {
        const authored = Number(target.dataset.restOpacity);
        return Number.isFinite(authored) ? authored : 1;
      },
      x: 0,
      y: 0,
      rotation: 0,
      scaleX: 1,
      scaleY: 1,
    }, restAt);
    if (motionShell) {
      const strong = isStrongCharacter(config);
      const breatheScale = strong ? STRONG_CHARACTER_IDLE_BREATHE_SCALE : CHARACTER_IDLE_BREATHE_SCALE;
      const breatheDuration = strong ? 0.15 : 0.22;
      const breatheStart = restAt + (strong ? 0.02 : 0.04);
      tl.set(motionShell, { scale: 1, transformOrigin: "center center" }, restAt)
        .to(motionShell, { scale: breatheScale, duration: breatheDuration, ease: "sine.inOut" }, breatheStart)
        .to(motionShell, { scale: 1, duration: breatheDuration, ease: "sine.inOut" }, breatheStart + breatheDuration);
    } else {
      tl.to({}, { duration: 0.01 }, restAt);
    }
    return tl;
  }

  function playRuntimeEdgeFlow(svg, manifest, gsap, motionMode = "expressive") {
    if (!manifest.stage || !manifest.stage.edge_flow) return [];
    const edgeGroups = Array.from(svg.querySelectorAll("g.edge"));
    const edgeEntries = Array.isArray(manifest.edges) ? manifest.edges : [];
    const configuredIndices = motionMode === "readable"
      ? manifest.stage.readable_edge_indices
      : manifest.stage.active_edge_indices;
    let activeEdges;
    if (Array.isArray(configuredIndices)) {
      activeEdges = configuredIndices
        .filter((edgeIndex) => Number.isInteger(edgeIndex) && edgeIndex >= 0 && edgeGroups[edgeIndex])
        .map((edgeIndex) => ({ group: edgeGroups[edgeIndex], edgeIndex, entry: edgeEntries[edgeIndex] || {} }));
    } else {
      const requestedLimit = motionMode === "readable" ? manifest.stage.readable_edge_limit : manifest.stage.edge_limit;
      activeEdges = edgeGroups
        .map((group, edgeIndex) => ({ group, edgeIndex, entry: edgeEntries[edgeIndex] || {} }))
        .filter((item) => !Number.isInteger(requestedLimit) || item.edgeIndex < Math.max(0, requestedLimit));

      const path = base.getAttribute("d");
      if (!path) return;
      const stroke = base.getAttribute("stroke") || "#38bdf8";
      const width = Math.max(1, numberAttr(base, "stroke-width", 2.4));
      const label = group.querySelector(".edge-label");
      const effect = String(entry.effect || "signal-arrow").replace(/[^a-z0-9-]/gi, "-").toLowerCase();
      const dotEffect = effect === "signal-dot" || effect === "flow-dot";
      const dashEffect = effect === "dynamic-dash" || effect === "dash-flow" || effect === "trace" || effect === "draw";
      const flowDash = Math.max(2.4, width * 1.4);
      const flowGap = Math.max(12, width * 7);

      group.dataset.runtimeEdgePacketShape = shortEdge ? "dot" : "segment";

        class: `edge-flow runtime-edge-flow runtime-edge-effect-${effect} runtime-generated`,

        fill: "none",
        stroke,
        "stroke-width": Math.max(1.2, width * 0.86).toFixed(1),
        "stroke-linecap": "round",
        "stroke-dasharray": `${flowDash.toFixed(1)} ${flowGap.toFixed(1)}`,
        "stroke-dashoffset": "0",

              cx: "0",
              cy: "0",

              fill: stroke,
              opacity: "0",
              "pointer-events": "none",
            })
          : createSvgElement("path", {
              class: `edge-particle runtime-edge-particle runtime-edge-packet runtime-edge-effect-${effect} runtime-generated`,
              d: path,
              fill: "none",
              stroke: "#ffffff",
              "stroke-width": Math.max(4.2, width * (2.35 - particleIndex * 0.22)).toFixed(1),
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              "stroke-dasharray": `${packetLength.toFixed(1)} ${packetGap.toFixed(1)}`,
              "stroke-dashoffset": packetGap.toFixed(1),
              opacity: "0",
              "pointer-events": "none",

              class: `edge-particle runtime-edge-particle runtime-edge-packet-core runtime-edge-short-packet-core runtime-edge-effect-${effect} runtime-generated`,
              cx: "0",
              cy: "0",
              r: Math.max(3.0, width * 1.45).toFixed(1),
              fill: stroke,
              opacity: "0",

              class: `edge-particle runtime-edge-particle runtime-edge-packet-core runtime-edge-effect-${effect} runtime-generated`,

              "stroke-dashoffset": packetGap.toFixed(1),

              "pointer-events": "none",

    groups.forEach((group, groupIndex) => {
      const rect = group.querySelector("rect");

      const stroke = rect.getAttribute("stroke") || "#7aa8ff";

        class: "runtime-group-field runtime-generated",

        y: rect.getAttribute("y") || "0",
        width: rect.getAttribute("width") || "0",
        height: rect.getAttribute("height") || "0",
        rx: rect.getAttribute("rx") || "22",
        fill: stroke,
        opacity: "0.045",
        filter: "url(#soft-glow)",

    "sine.in",
    "sine.out",
    "sine.inOut",

    "power1.inOut",

    if (!isSafePartName(name)) return null;
    if (Object.prototype.hasOwnProperty.call(parts, name)) return parts[name];
    const runtimeName = name.replace(/-([a-z0-9])/g, (_, character) => character.toUpperCase());
    return Object.prototype.hasOwnProperty.call(parts, runtimeName)
      ? parts[runtimeName]
      : null;

  function validRecipeProperty(name, value, rotationLimit) {
    if (!SHOWCASE_RECIPE_PROPERTIES.has(name) || !Number.isFinite(value)) return false;
    if ((name === "x" || name === "y") && Math.abs(value) > 10) return false;
    if (name === "rotate" && Math.abs(value) > rotationLimit) return false;
    if (["scale", "scaleX", "scaleY"].includes(name) && (value < 0.12 || value > 1.45)) return false;
    if (name === "opacity" && (value < 0 || value > 1)) return false;
    return true;
  }

  function validateShowcaseRecipe(config, parts) {
    if (config.presentation_profile !== "showcase" || config.icon_system !== "diagram-core-v1") return null;
    if (!hasOnlyKeys(config.recipe, ["tracks"])) return null;
    if (!Number.isFinite(config.rest_at) || config.rest_at <= 0) return null;
    const tracks = config.recipe.tracks;
    if (!Array.isArray(tracks) || !tracks.length || tracks.length > 12) return null;
    const compiled = [];
    const seenTargets = new Set();
    for (const track of tracks) {
      if (!hasOnlyKeys(track, ["parts", "steps"])) return null;
      if (!Array.isArray(track.parts) || !track.parts.length || track.parts.length > 4) return null;
      if (track.parts.some((name) => typeof name !== "string") || new Set(track.parts).size !== track.parts.length) return null;
      const targets = track.parts.map((name) => resolvedRecipePart(parts, name));
      if (targets.some((target) => !target)) return null;
      if (targets.some((target) => seenTargets.has(target))) return null;
      targets.forEach((target) => seenTargets.add(target));
      if (!Array.isArray(track.steps) || !track.steps.length || track.steps.length > 12) return null;
      const rotationLimit = config.icon === "search"
        && track.parts.length === 1
        && track.parts[0] === "scan"

        if (!isPlainObject(step.to) || !Object.keys(step.to).length) return null;
        if (Object.entries(step.to).some(([name, value]) => !validRecipeProperty(name, value, rotationLimit))) return null;
        if (!Number.isFinite(step.duration) || step.duration < 0.04 || step.duration > 0.8) return null;

        const stagger = step.stagger === undefined ? 0 : step.stagger;

        if (!SHOWCASE_RECIPE_EASES.has(step.ease)) return null;
        if (step.at + step.duration + stagger * (targets.length - 1) > config.rest_at + 1e-9) return null;
        steps.push(step);
