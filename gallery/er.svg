  <rect class="node-glow" x="516.0" y="446.0" width="168.0" height="90.0" rx="12.0"
        fill="none" stroke="#0891b2" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="3.90s" begin="0.68s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="3.90s" begin="0.68s" repeatCount="indefinite" />
