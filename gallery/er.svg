<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">ER</title>
<desc id="diagram-desc">entities and relationships</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: round; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#ffffff" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#eeeeee" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#d4d4d4" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#10a37f" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#f4f7f6" />
<text id="main-title" x="90" y="84" class="title" fill="#111111" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.08s" fill="freeze" />
  ER
</text>
<text x="74" y="126" class="subtitle" fill="#626262" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.28s" fill="freeze" />
  entities and relationships
</text>


<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#a16207" />
  </marker>
</defs>
<g class="edge" data-role="actor">
  <path class="edge-base" d="M 370.0 291.0 L 520.0 291.0" fill="none" stroke="#a16207" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-1)" />
  <path class="edge-draw" d="M 370.0 291.0 L 520.0 291.0" fill="none" stroke="#a16207" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-1)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.9s" begin="0.16s" fill="freeze" />
  </path>
  <path class="edge-flow" d="M 370.0 291.0 L 520.0 291.0" fill="none" stroke="#a16207" stroke-width="1.7"
        stroke-dasharray="9 18" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-54" dur="3.02s" begin="0.36s" repeatCount="indefinite" />
  </path>
  <circle class="edge-particle" r="5.5" fill="#a16207" opacity="0.92">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 370.0 291.0 L 520.0 291.0" begin="0.32s" />
    <animate attributeName="opacity" values="0;0.92;0" dur="4.2s" begin="0.32s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="3.5" fill="#a16207" opacity="0.74">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 370.0 291.0 L 520.0 291.0" begin="1.72s" />
    <animate attributeName="opacity" values="0;0.74;0" dur="4.2s" begin="1.72s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="2.4" fill="#a16207" opacity="0.56">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 370.0 291.0 L 520.0 291.0" begin="3.12s" />
    <animate attributeName="opacity" values="0;0.56;0" dur="4.2s" begin="3.12s" repeatCount="indefinite" />
  </circle>

  <text x="445.0" y="277.0" class="edge-label" fill="#626262" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.71s" fill="freeze" />
    owns
  </text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#404040" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path class="edge-base" d="M 680.0 291.0 L 830.0 291.0" fill="none" stroke="#404040" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-2)" />
  <path class="edge-draw" d="M 680.0 291.0 L 830.0 291.0" fill="none" stroke="#404040" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-2)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.9s" begin="0.32s" fill="freeze" />
  </path>
  <path class="edge-flow" d="M 680.0 291.0 L 830.0 291.0" fill="none" stroke="#404040" stroke-width="1.7"
        stroke-dasharray="9 18" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-54" dur="3.02s" begin="0.52s" repeatCount="indefinite" />
  </path>
  <circle class="edge-particle" r="5.5" fill="#404040" opacity="0.92">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 680.0 291.0 L 830.0 291.0" begin="0.64s" />
    <animate attributeName="opacity" values="0;0.92;0" dur="4.2s" begin="0.64s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="3.5" fill="#404040" opacity="0.74">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 680.0 291.0 L 830.0 291.0" begin="2.04s" />
    <animate attributeName="opacity" values="0;0.74;0" dur="4.2s" begin="2.04s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="2.4" fill="#404040" opacity="0.56">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 680.0 291.0 L 830.0 291.0" begin="3.44s" />
    <animate attributeName="opacity" values="0;0.56;0" dur="4.2s" begin="3.44s" repeatCount="indefinite" />
  </circle>

  <text x="755.0" y="277.0" class="edge-label" fill="#626262" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="0.87s" fill="freeze" />
    contains
  </text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#0891b2" />
  </marker>
</defs>
<g class="edge" data-role="source">
  <path class="edge-base" d="M 600.0 332.0 L 600.0 450.0" fill="none" stroke="#0891b2" stroke-width="1.7" opacity="0.24" marker-end="url(#arrow-3)" />
  <path class="edge-draw" d="M 600.0 332.0 L 600.0 450.0" fill="none" stroke="#0891b2" stroke-width="2.4" pathLength="1"
        stroke-dasharray="1" stroke-dashoffset="1" marker-end="url(#arrow-3)">
    <animate attributeName="stroke-dashoffset" values="1;0" dur="0.9s" begin="0.48s" fill="freeze" />
  </path>
  <path class="edge-flow" d="M 600.0 332.0 L 600.0 450.0" fill="none" stroke="#0891b2" stroke-width="1.7"
        stroke-dasharray="9 18" opacity="0.55">
    <animate attributeName="stroke-dashoffset" values="0;-54" dur="3.02s" begin="0.68s" repeatCount="indefinite" />
  </path>
  <circle class="edge-particle" r="5.5" fill="#0891b2" opacity="0.92">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 600.0 332.0 L 600.0 450.0" begin="0.96s" />
    <animate attributeName="opacity" values="0;0.92;0" dur="4.2s" begin="0.96s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="3.5" fill="#0891b2" opacity="0.74">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 600.0 332.0 L 600.0 450.0" begin="2.36s" />
    <animate attributeName="opacity" values="0;0.74;0" dur="4.2s" begin="2.36s" repeatCount="indefinite" />
  </circle>
  <circle class="edge-particle" r="2.4" fill="#0891b2" opacity="0.56">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 600.0 332.0 L 600.0 450.0" begin="3.76s" />
    <animate attributeName="opacity" values="0;0.56;0" dur="4.2s" begin="3.76s" repeatCount="indefinite" />
  </circle>

  <text x="600.0" y="377.0" class="edge-label" fill="#626262" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.45s" begin="1.03s" fill="freeze" />
    emits
  </text>
</g>

<g id="node-account" class="node motion-node" data-role="actor" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.12s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3;0 0;0 2;0 0" dur="5.85s" begin="0.82s"
        repeatCount="indefinite" additive="sum" />

  <rect class="node-glow" x="206.0" y="246.0" width="168.0" height="90.0" rx="12.0"
        fill="none" stroke="#a16207" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.25s" begin="0.32s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.25s" begin="0.32s" repeatCount="indefinite" />
  </rect>
  <rect x="210.0" y="250.0" width="160.0" height="82.0" rx="8.0"
        fill="#fffbe8" stroke="#a16207" stroke-width="1.5" />

  <circle cx="228.0" cy="268.0" r="14" fill="#a16207" />
  <text x="228.0" y="273.0" class="step-label" fill="#fffbe8" text-anchor="middle">1</text>
  <text x="290.0" y="277.0" text-anchor="middle" fill="#111111">
<tspan x="290.0" dy="18" class="node-title">Account</tspan>
<tspan x="290.0" dy="17" class="node-caption">id, name</tspan>
</text>
</g>

<g id="node-project" class="node motion-node" data-role="process" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.24s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3;0 0;0 2;0 0" dur="6.30s" begin="0.94s"
        repeatCount="indefinite" additive="sum" />

  <rect class="node-glow" x="516.0" y="246.0" width="168.0" height="90.0" rx="12.0"
        fill="none" stroke="#404040" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.60s" begin="0.44s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.60s" begin="0.44s" repeatCount="indefinite" />
  </rect>
  <rect x="520.0" y="250.0" width="160.0" height="82.0" rx="8.0"
        fill="#fafafa" stroke="#404040" stroke-width="1.5" />

  <circle cx="538.0" cy="268.0" r="14" fill="#404040" />
  <text x="538.0" y="273.0" class="step-label" fill="#fafafa" text-anchor="middle">2</text>
  <text x="600.0" y="277.0" text-anchor="middle" fill="#111111">
<tspan x="600.0" dy="18" class="node-title">Project</tspan>
<tspan x="600.0" dy="17" class="node-caption">id, owner</tspan>
</text>
</g>

<g id="node-artifact" class="node motion-node" data-role="memory" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.55s" begin="0.36s" fill="freeze" />
  <animateTransform attributeName="transform" type="translate"
        values="0 0;0 -3;0 0;0 2;0 0" dur="5.40s" begin="1.06s"
        repeatCount="indefinite" additive="sum" />

  <rect class="node-glow" x="826.0" y="246.0" width="168.0" height="90.0" rx="12.0"
        fill="none" stroke="#15803d" stroke-width="1.2" opacity="0.12" filter="url(#soft-glow)">
    <animate attributeName="opacity" values="0.08;0.24;0.08" dur="4.95s" begin="0.56s" repeatCount="indefinite" />
    <animate attributeName="stroke-width" values="1.0;2.4;1.0" dur="4.95s" begin="0.56s" repeatCount="indefinite" />
  </rect>
  <rect x="830.0" y="250.0" width="160.0" height="82.0" rx="8.0"
        fill="#f0fdf4" stroke="#15803d" stroke-width="1.5" />

  <circle cx="848.0" cy="268.0" r="14" fill="#15803d" />
  <text x="848.0" y="273.0" class="step-label" fill="#f0fdf4" text-anchor="middle">3</text>
  <text x="910.0" y="277.0" text-anchor="middle" fill="#111111">
<tspan x="910.0" dy="18" class="node-title">Artifact</tspan>
<tspan x="910.0" dy="17" class="node-caption">id, project</tspan>
</text>
</g>

<g id="node-audit" class="node motion-node" data-role="source" opacity="0">
