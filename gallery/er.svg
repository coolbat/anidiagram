  <rect x="520.0" y="450.0" width="160.0" height="82.0" rx="8.0"
        fill="#f0fdff" stroke="#0891b2" stroke-width="1.5" />

  <circle cx="538.0" cy="468.0" r="14" fill="#0891b2" />
  <text x="538.0" y="473.0" class="step-label" fill="#f0fdff" text-anchor="middle">4</text>
  <text x="600.0" y="477.0" text-anchor="middle" fill="#111111">
<tspan x="600.0" dy="18" class="node-title">Audit Log</tspan>
<tspan x="600.0" dy="17" class="node-caption">event, actor</tspan>
</text>
</g>
</svg>
