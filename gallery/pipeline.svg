<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Pipeline</title>
<desc id="diagram-desc">linear work from input to output</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<rect width="100%" height="100%" fill="#07162c" />
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#12345c" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#2f6f9f" stroke-width="1.4" />
<rect x="44" y="44" width="12" height="52" rx="6" fill="#55c7ff" />
<rect x="72" y="46" width="360" height="56" rx="16" fill="#0d3b5c" />
<text id="main-title" x="90" y="84" class="title" fill="#e6f7ff">Pipeline</text>
<text x="74" y="126" class="subtitle" fill="#9cc7e8">linear work from input to output</text>


<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 230.0 361.0 L 275.0 361.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-1)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 230.0 361.0 L 275.0 361.0" begin="0.35s" />
  </circle>

  <circle cx="230.5" cy="342.0" r="14" fill="#55c7ff" />
  <text x="230.5" y="347.0" class="step-label" fill="#ffffff" text-anchor="middle">1</text>
  <text x="252.5" y="347.0" class="edge-label" fill="#9cc7e8">flow</text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 435.0 361.0 L 480.0 361.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-2)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 435.0 361.0 L 480.0 361.0" begin="0.70s" />
  </circle>

  <circle cx="435.5" cy="342.0" r="14" fill="#55c7ff" />
  <text x="435.5" y="347.0" class="step-label" fill="#ffffff" text-anchor="middle">2</text>
  <text x="457.5" y="347.0" class="edge-label" fill="#9cc7e8">flow</text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 640.0 361.0 L 685.0 361.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-3)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 640.0 361.0 L 685.0 361.0" begin="1.05s" />
  </circle>

  <circle cx="640.5" cy="342.0" r="14" fill="#55c7ff" />
  <text x="640.5" y="347.0" class="step-label" fill="#ffffff" text-anchor="middle">3</text>
  <text x="662.5" y="347.0" class="edge-label" fill="#9cc7e8">flow</text>
</g>

<defs>
  <marker id="arrow-4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#55c7ff" />
  </marker>
</defs>
<g class="edge" data-role="process">
  <path d="M 845.0 361.0 L 890.0 361.0" fill="none" stroke="#55c7ff" stroke-width="2.0" marker-end="url(#arrow-4)" />
  <circle r="5" fill="#55c7ff">
    <animateMotion dur="4.6s" repeatCount="indefinite" path="M 845.0 361.0 L 890.0 361.0" begin="1.40s" />
  </circle>

  <circle cx="845.5" cy="342.0" r="14" fill="#55c7ff" />
  <text x="845.5" y="347.0" class="step-label" fill="#ffffff" text-anchor="middle">4</text>
  <text x="867.5" y="347.0" class="edge-label" fill="#9cc7e8">flow</text>
</g>

<g id="node-input" class="node" data-role="source">
  <rect x="70.0" y="320.0" width="160.0" height="82.0" rx="8.0"
        fill="#0b273c" stroke="#7dd3fc" stroke-width="1.8" />

  <circle cx="88.0" cy="338.0" r="14" fill="#7dd3fc" />
  <text x="88.0" y="343.0" class="step-label" fill="#0b273c" text-anchor="middle">1</text>
  <text x="150.0" y="347.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="150.0" dy="18" class="node-title">Input</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-clean" class="node" data-role="process">
  <rect x="275.0" y="320.0" width="160.0" height="82.0" rx="8.0"
        fill="#0b1d38" stroke="#55c7ff" stroke-width="1.8" />

  <circle cx="293.0" cy="338.0" r="14" fill="#55c7ff" />
  <text x="293.0" y="343.0" class="step-label" fill="#0b1d38" text-anchor="middle">2</text>
  <text x="355.0" y="347.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="355.0" dy="18" class="node-title">Clean</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-model" class="node" data-role="agent">
  <rect x="480.0" y="320.0" width="160.0" height="82.0" rx="8.0"
        fill="#101b45" stroke="#a7b8ff" stroke-width="1.8" />

  <circle cx="498.0" cy="338.0" r="14" fill="#a7b8ff" />
  <text x="498.0" y="343.0" class="step-label" fill="#101b45" text-anchor="middle">3</text>
  <text x="560.0" y="347.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="560.0" dy="18" class="node-title">Model</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-review" class="node" data-role="tool">
  <rect x="685.0" y="320.0" width="160.0" height="82.0" rx="8.0"
        fill="#1f2835" stroke="#f6d365" stroke-width="1.8" />

  <circle cx="703.0" cy="338.0" r="14" fill="#f6d365" />
  <text x="703.0" y="343.0" class="step-label" fill="#1f2835" text-anchor="middle">4</text>
  <text x="765.0" y="347.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="765.0" dy="18" class="node-title">Review</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-ship" class="node" data-role="output">
  <rect x="890.0" y="320.0" width="160.0" height="82.0" rx="8.0"
        fill="#0a2d33" stroke="#33e6a6" stroke-width="1.8" />

  <circle cx="908.0" cy="338.0" r="14" fill="#33e6a6" />
  <text x="908.0" y="343.0" class="step-label" fill="#0a2d33" text-anchor="middle">5</text>
  <text x="970.0" y="347.0" text-anchor="middle" fill="#e6f7ff">
<tspan x="970.0" dy="18" class="node-title">Ship</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>
</svg>
