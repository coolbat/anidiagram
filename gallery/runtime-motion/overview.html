  function finishCharacterAtRest(tl, parts, restAt, config = null) {
    const targets = Object.entries(parts)
      .filter(([name, part]) => name !== "root" && Boolean(part))
      .map(([, part]) => part);
    const motionShell = parts.root && parts.root.querySelector(".illustrated-character-motion-shell");
    tl.set(targets, {
      opacity: (index, target) => {
        const authored = Number(target.dataset.restOpacity);
        return Number.isFinite(authored) ? authored : 1;
      },
      x: 0,
      y: 0,
      rotation: 0,
      scaleX: 1,
      scaleY: 1,
    }, restAt);
    if (motionShell) {
      const strong = isStrongCharacter(config);
      const breatheScale = strong ? STRONG_CHARACTER_IDLE_BREATHE_SCALE : CHARACTER_IDLE_BREATHE_SCALE;
      const breatheDuration = strong ? 0.15 : 0.22;
      const breatheStart = restAt + (strong ? 0.02 : 0.04);
      tl.set(motionShell, { scale: 1, transformOrigin: "center center" }, restAt)
        .to(motionShell, { scale: breatheScale, duration: breatheDuration, ease: "sine.inOut" }, breatheStart)
        .to(motionShell, { scale: 1, duration: breatheDuration, ease: "sine.inOut" }, breatheStart + breatheDuration);
    } else {
      tl.to({}, { duration: 0.01 }, restAt);
    }
    return tl;
  }

  function playTokenIntentReady({ config, parts, gsap }) {

  function createSvgElement(name, attrs) {

    Object.entries(attrs || {}).forEach(([key, value]) => {
      el.setAttribute(key, String(value));
    });
    return el;
  }

  function numberAttr(el, name, fallback) {
    const value = Number.parseFloat(el.getAttribute(name) || "");
    return Number.isFinite(value) ? value : fallback;

  const EDGE_PACKET_COUNT = 1;
  const EDGE_PACKET_REPEAT_DELAY = 0.0;
  const SHORT_EDGE_THRESHOLD = 120;
  let currentMotionMode = "expressive";

  function clearRuntimeStageEffects() {
    document.querySelectorAll(".runtime-generated").forEach((el) => el.remove());
    const highlight = document.querySelector("#viewport svg #title-highlight");
    if (highlight && highlight.dataset.runtimeTitleWidth) {
      highlight.setAttribute("x", highlight.dataset.runtimeTitleX || highlight.getAttribute("x") || "72");
      highlight.setAttribute("width", highlight.dataset.runtimeTitleWidth);
      highlight.style.removeProperty("opacity");
      highlight.style.removeProperty("transform");
      highlight.style.removeProperty("transform-origin");
    }
  }

  function playTitleSweep(svg, manifest, gsap) {
    if (!manifest.stage || !manifest.stage.title_sweep) return [];
    const highlight = svg.querySelector("#title-highlight");
    if (!highlight) return [];
    const x = numberAttr(highlight, "x", 72);
    const width = Math.max(120, numberAttr(highlight, "width", 360));
    highlight.dataset.runtimeTitleX = String(x);
    highlight.dataset.runtimeTitleWidth = String(width);
    gsap.set(highlight, { attr: { x, width }, scaleX: 0, opacity: 0.08, transformOrigin: "left center" });
    const tl = gsap.timeline();

    return [tl];
  }

  function playRuntimeEdgeFlow(svg, manifest, gsap, motionMode = "expressive") {
    if (!manifest.stage || !manifest.stage.edge_flow) return [];
    const edgeGroups = Array.from(svg.querySelectorAll("g.edge"));
    const edgeEntries = Array.isArray(manifest.edges) ? manifest.edges : [];
    const configuredIndices = motionMode === "readable"
      ? manifest.stage.readable_edge_indices
      : manifest.stage.active_edge_indices;
    let activeEdges;
    if (Array.isArray(configuredIndices)) {
      activeEdges = configuredIndices
        .filter((edgeIndex) => Number.isInteger(edgeIndex) && edgeIndex >= 0 && edgeGroups[edgeIndex])
        .map((edgeIndex) => ({ group: edgeGroups[edgeIndex], edgeIndex, entry: edgeEntries[edgeIndex] || {} }));
    } else {
      const requestedLimit = motionMode === "readable" ? manifest.stage.readable_edge_limit : manifest.stage.edge_limit;
      activeEdges = edgeGroups
        .map((group, edgeIndex) => ({ group, edgeIndex, entry: edgeEntries[edgeIndex] || {} }))
        .filter((item) => !Number.isInteger(requestedLimit) || item.edgeIndex < Math.max(0, requestedLimit));
    }
    const timelines = [];
    activeEdges.forEach(({ group, edgeIndex, entry }) => {
      const base = group.querySelector("path.edge-base");
      if (!base || !base.getTotalLength) return;
      const length = Math.max(1, base.getTotalLength());
      const path = base.getAttribute("d");
      if (!path) return;
      const stroke = base.getAttribute("stroke") || "#38bdf8";
      const width = Math.max(1, numberAttr(base, "stroke-width", 2.4));
      const label = group.querySelector(".edge-label");
      const effect = String(entry.effect || "signal-arrow").replace(/[^a-z0-9-]/gi, "-").toLowerCase();
      const dotEffect = effect === "signal-dot" || effect === "flow-dot";
      const dashEffect = effect === "dynamic-dash" || effect === "dash-flow" || effect === "trace" || effect === "draw";
      const flowDash = Math.max(2.4, width * 1.4);
      const flowGap = Math.max(12, width * 7);
      const shortEdge = length <= SHORT_EDGE_THRESHOLD;
      group.dataset.runtimeEdgeEffect = effect;
      group.dataset.runtimeEdgePacketShape = shortEdge ? "dot" : "segment";
      const flow = createSvgElement("path", {
        class: `edge-flow runtime-edge-flow runtime-edge-effect-${effect} runtime-generated`,
        d: path,
        fill: "none",
        stroke,
        "stroke-width": Math.max(1.2, width * 0.86).toFixed(1),
        "stroke-linecap": "round",
        "stroke-dasharray": `${flowDash.toFixed(1)} ${flowGap.toFixed(1)}`,
        "stroke-dashoffset": "0",
        opacity: motionMode === "readable" ? "0.09" : "0.20",
        "pointer-events": "none",
      });
      if (label) group.insertBefore(flow, label);
      else group.appendChild(flow);
      for (let particleIndex = 0; particleIndex < EDGE_PACKET_COUNT; particleIndex += 1) {
        const packetLength = dotEffect
          ? Math.max(1.8, width * 0.55)
          : dashEffect
            ? Math.max(8, Math.min(20, length * 0.18))
            : Math.max(13, Math.min(34, length * 0.42));
        const packetGap = Math.max(52, length + packetLength * 2.8);
        const packet = shortEdge
          ? createSvgElement("circle", {
              class: `edge-particle runtime-edge-particle runtime-edge-packet runtime-edge-short-packet runtime-edge-effect-${effect} runtime-generated`,
              cx: "0",
              cy: "0",
              r: Math.max(4.5, width * 2.2).toFixed(1),
              fill: stroke,
              opacity: "0",
              "pointer-events": "none",
            })
          : createSvgElement("path", {
              class: `edge-particle runtime-edge-particle runtime-edge-packet runtime-edge-effect-${effect} runtime-generated`,
              d: path,
              fill: "none",
              stroke: "#ffffff",
              "stroke-width": Math.max(4.2, width * (2.35 - particleIndex * 0.22)).toFixed(1),
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              "stroke-dasharray": `${packetLength.toFixed(1)} ${packetGap.toFixed(1)}`,
              "stroke-dashoffset": packetGap.toFixed(1),
              opacity: "0",
              "pointer-events": "none",
            });
        const core = shortEdge
          ? createSvgElement("circle", {
              class: `edge-particle runtime-edge-particle runtime-edge-packet-core runtime-edge-short-packet-core runtime-edge-effect-${effect} runtime-generated`,
              cx: "0",
              cy: "0",
              r: Math.max(3.0, width * 1.45).toFixed(1),
              fill: stroke,
              opacity: "0",
              "pointer-events": "none",
            })
          : createSvgElement("path", {
              class: `edge-particle runtime-edge-particle runtime-edge-packet-core runtime-edge-effect-${effect} runtime-generated`,
              d: path,
              fill: "none",
              stroke,
              "stroke-width": Math.max(2.6, width * (1.48 - particleIndex * 0.14)).toFixed(1),
              "stroke-linecap": "round",
              "stroke-linejoin": "round",
              "stroke-dasharray": `${(dotEffect ? Math.max(1.2, width * 0.35) : Math.max(6, packetLength * 0.62)).toFixed(1)} ${packetGap.toFixed(1)}`,
              "stroke-dashoffset": packetGap.toFixed(1),
              opacity: "0",
              "pointer-events": "none",
            });
        if (label) {
          group.insertBefore(packet, label);
          group.insertBefore(core, label);
        } else {
          group.appendChild(packet);
          group.appendChild(core);
        }
        const duration = 2.05 + ((edgeIndex + particleIndex) % 5) * 0.13;
        const semanticDelay = Number.isFinite(Number(entry.delay)) ? Number(entry.delay) : 0;
        const delay = semanticDelay;
        const tl = gsap.timeline({ repeat: -1, repeatDelay: EDGE_PACKET_REPEAT_DELAY, delay });
        tl.fromTo(
          flow,
          { attr: { "stroke-dashoffset": 0 } },
          { attr: { "stroke-dashoffset": -(flowDash + flowGap) }, duration, ease: "none" },
          0
        );
        if (shortEdge) {
          const travel = { distance: 0 };
          const placeDot = () => {
            const point = base.getPointAtLength(travel.distance);
            packet.setAttribute("cx", point.x.toFixed(2));
            packet.setAttribute("cy", point.y.toFixed(2));
            core.setAttribute("cx", point.x.toFixed(2));
            core.setAttribute("cy", point.y.toFixed(2));
          };
          placeDot();
          tl.to(travel, { distance: length, duration, ease: "none", onUpdate: placeDot }, 0);
        } else {
          tl.fromTo(
            [packet, core],
            { attr: { "stroke-dashoffset": packetGap + packetLength } },
            { attr: { "stroke-dashoffset": -(length + packetLength) }, duration, ease: "none" },
            0
          );
        }
        tl.to(packet, { opacity: motionMode === "readable" ? 0.62 : 0.86, duration: 0.14, ease: "power1.out" }, 0)
          .to(core, { opacity: motionMode === "readable" ? 0.82 : 1, duration: 0.14, ease: "power1.out" }, 0)
          .to([packet, core], { opacity: 0, duration: 0.14, ease: "power1.in" }, Math.max(0, duration - 0.14));
        tl.__anidiagramStage = "edge-packet";
        tl.__anidiagramEdgeIndex = edgeIndex;
        tl.__anidiagramEdgeEffect = effect;
        timelines.push(tl);
      }
    });
    return timelines;
  }

  function playRuntimeRelationCircles(svg, manifest, gsap) {
    if (!manifest.stage || !manifest.stage.relation_circles) return [];
    const timelines = [];
    const edgeGroups = Array.from(svg.querySelectorAll("g.edge"));
    const firstEdge = edgeGroups[0] || null;
    edgeGroups.forEach((group, edgeIndex) => {
      if (edgeIndex % 2 !== 0) return;
      const base = group.querySelector("path.edge-base");
      if (!base || !base.getBBox) return;
      const box = base.getBBox();
      const width = Math.max(44, box.width + 24);
      const height = Math.max(32, box.height + 20);
      if (width > 520 || height > 320) return;
      const stroke = base.getAttribute("stroke") || "#7aa8ff";
      const ring = createSvgElement("ellipse", {
        class: "runtime-relation-circle runtime-generated",
        cx: (box.x + box.width / 2).toFixed(1),
        cy: (box.y + box.height / 2).toFixed(1),
        rx: (width / 2).toFixed(1),
        ry: (height / 2).toFixed(1),
        fill: "none",
        stroke,
        "stroke-width": "1.5",
        "stroke-dasharray": "7 8",
        "stroke-dashoffset": "0",
        opacity: "0.18",
        "pointer-events": "none",
      });
      if (firstEdge) svg.insertBefore(ring, firstEdge);
      else svg.appendChild(ring);
      timelines.push(
        gsap.to(ring, {
          attr: { "stroke-dashoffset": -48 },
          opacity: 0.34,
          duration: 4.8 + (edgeIndex % 3) * 0.35,
          yoyo: true,
          repeat: -1,
          ease: "sine.inOut",
        })
      );
    });
    return timelines;
  }

  function playRuntimeGroupFields(svg, manifest, gsap) {
    if (!manifest.stage || !manifest.stage.group_fields) return [];
    const timelines = [];
    const groups = Array.from(svg.querySelectorAll("g.group"));
    groups.forEach((group, groupIndex) => {
      const rect = group.querySelector("rect");
      if (!rect) return;
      const stroke = rect.getAttribute("stroke") || "#7aa8ff";
      const field = createSvgElement("rect", {
        class: "runtime-group-field runtime-generated",
        x: rect.getAttribute("x") || "0",
        y: rect.getAttribute("y") || "0",
        width: rect.getAttribute("width") || "0",
        height: rect.getAttribute("height") || "0",
        rx: rect.getAttribute("rx") || "22",
        fill: stroke,
        opacity: "0.045",
        filter: "url(#soft-glow)",
        "pointer-events": "none",
      });
      group.insertBefore(field, rect);
      timelines.push(
        gsap.to(field, {
          opacity: 0.11,
          x: groupIndex % 2 === 0 ? 3 : -3,
          y: groupIndex % 2 === 0 ? -2 : 2,
          duration: 3.8 + groupIndex * 0.28,
          yoyo: true,
          repeat: -1,
          ease: "sine.inOut",
        })
      );
    });
    return timelines;
  }

  function playStageEffects(manifest, motionMode = "expressive") {
    if (!window.gsap) return [];
    const svg = document.querySelector("#viewport svg");
    if (!svg) return [];
    clearRuntimeStageEffects();
    if (motionMode === "off") return [];
    return [
      ...(motionMode === "expressive" ? playTitleSweep(svg, manifest, window.gsap) : []),
      ...playRuntimeEdgeFlow(svg, manifest, window.gsap, motionMode),
      ...(motionMode === "expressive" ? playRuntimeRelationCircles(svg, manifest, window.gsap) : []),
      ...(motionMode === "expressive" ? playRuntimeGroupFields(svg, manifest, window.gsap) : []),
    ];
  }

  const SHOWCASE_TIME_SCALE = 0.6;

  function showcaseTimeline(gsap, config) {
    if (!config || !Number.isFinite(config.rest_at) || !Number.isFinite(config.repeat_delay)) return null;
    const tl = gsap.timeline({
      repeat: -1,
      repeatDelay: config.repeat_delay * SHOWCASE_TIME_SCALE,
    });
    tl.__anidiagramPresentation = "showcase";
    return tl;
  }

  function markShowcaseRest(timeline, config) {
    timeline.__anidiagramRestAt = config.rest_at;
    timeline.timeScale(SHOWCASE_TIME_SCALE);
    return timeline;
  }

  const SHOWCASE_RECIPE_PROPERTIES = new Set(["x", "y", "rotate", "scale", "scaleX", "scaleY", "opacity"]);
  const SHOWCASE_RECIPE_EASES = new Set([
    "none",
    "sine.in",
    "sine.out",
    "sine.inOut",
    "power1.in",
    "power1.out",
    "power1.inOut",
    "power2.in",
    "power2.out",
    "power2.inOut",
    "power3.in",
    "power3.out",
    "power3.inOut",
    "back.out(2.4)",
    "back.out(2.8)",
    "back.out(3)",
    "back.out(3.5)",
    "bounce.out",
    "elastic.out(1, 0.35)",
    "elastic.out(1, 0.4)",
  ]);

  function isPlainObject(value) {
    return Boolean(value) && typeof value === "object" && !Array.isArray(value);
  }

  function hasOnlyKeys(value, required, optional = []) {
    if (!isPlainObject(value)) return false;
    const allowed = new Set([...required, ...optional]);
    const keys = Object.keys(value);
    return required.every((key) => Object.prototype.hasOwnProperty.call(value, key))
      && keys.every((key) => allowed.has(key));
  }

  function resolvedRecipePart(parts, name) {
    if (!isSafePartName(name)) return null;
    if (Object.prototype.hasOwnProperty.call(parts, name)) return parts[name];
    const runtimeName = name.replace(/-([a-z0-9])/g, (_, character) => character.toUpperCase());
    return Object.prototype.hasOwnProperty.call(parts, runtimeName)
      ? parts[runtimeName]
      : null;
  }

  function validRecipeProperty(name, value, rotationLimit) {
    if (!SHOWCASE_RECIPE_PROPERTIES.has(name) || !Number.isFinite(value)) return false;
    if ((name === "x" || name === "y") && Math.abs(value) > 10) return false;
    if (name === "rotate" && Math.abs(value) > rotationLimit) return false;
    if (["scale", "scaleX", "scaleY"].includes(name) && (value < 0.12 || value > 1.45)) return false;
    if (name === "opacity" && (value < 0 || value > 1)) return false;
    return true;
  }

  function validateShowcaseRecipe(config, parts) {
    if (config.presentation_profile !== "showcase" || config.icon_system !== "diagram-core-v1") return null;
    if (!hasOnlyKeys(config.recipe, ["tracks"])) return null;
    if (!Number.isFinite(config.rest_at) || config.rest_at <= 0) return null;
    const tracks = config.recipe.tracks;
    if (!Array.isArray(tracks) || !tracks.length || tracks.length > 12) return null;
    const compiled = [];
    const seenTargets = new Set();
    for (const track of tracks) {
      if (!hasOnlyKeys(track, ["parts", "steps"])) return null;
      if (!Array.isArray(track.parts) || !track.parts.length || track.parts.length > 4) return null;
      if (track.parts.some((name) => typeof name !== "string") || new Set(track.parts).size !== track.parts.length) return null;
      const targets = track.parts.map((name) => resolvedRecipePart(parts, name));
      if (targets.some((target) => !target)) return null;
      if (targets.some((target) => seenTargets.has(target))) return null;
      targets.forEach((target) => seenTargets.add(target));
      if (!Array.isArray(track.steps) || !track.steps.length || track.steps.length > 12) return null;
      const rotationLimit = config.icon === "search"
        && track.parts.length === 1
        && track.parts[0] === "scan"
        ? 360
        : 14;
      const steps = [];
      for (const step of track.steps) {
        if (!hasOnlyKeys(step, ["to", "duration", "ease", "at"], ["stagger"])) return null;
        if (!isPlainObject(step.to) || !Object.keys(step.to).length) return null;
        if (Object.entries(step.to).some(([name, value]) => !validRecipeProperty(name, value, rotationLimit))) return null;
        if (!Number.isFinite(step.duration) || step.duration < 0.04 || step.duration > 0.8) return null;
        if (!Number.isFinite(step.at) || step.at < 0) return null;
        const stagger = step.stagger === undefined ? 0 : step.stagger;
        if (!Number.isFinite(stagger) || stagger < 0 || stagger > 0.12) return null;
        if (!SHOWCASE_RECIPE_EASES.has(step.ease)) return null;
        if (step.at + step.duration + stagger * (targets.length - 1) > config.rest_at + 1e-9) return null;
        steps.push(step);
      }
      compiled.push({ targets, steps });
    }
    return compiled;
  }

  function authoredRest(gsap, target) {
    const number = (name, fallback) => {
      const value = Number(gsap.getProperty(target, name));
      return Number.isFinite(value) ? value : fallback;
    };
    return {
      x: number("x", 0),
      y: number("y", 0),
      rotation: number("rotation", 0),
      scaleX: number("scaleX", 1),
      scaleY: number("scaleY", 1),
      opacity: number("opacity", 1),
    };
  }

  function playDeclarativeShowcase({ config, parts, gsap }) {
    const compiled = validateShowcaseRecipe(config, parts);
    if (!compiled) return null;
    const targets = [...new Set(compiled.flatMap((track) => track.targets))];
    const rest = new Map(targets.map((target) => [target, authoredRest(gsap, target)]));
    setInitial(parts, gsap);
    const tl = showcaseTimeline(gsap, config);
    if (!tl) return null;
    compiled.forEach((track) => {
      track.steps.forEach((step) => {
        const variables = {
          ...step.to,
          duration: step.duration,
          ease: step.ease,
        };
        if (step.stagger !== undefined) variables.stagger = step.stagger;
        tl.to(track.targets, variables, step.at);
      });
    });
    targets.forEach((target) => tl.set(target, rest.get(target), config.rest_at));
    return markShowcaseRest(tl, config);
  }

  function playAgentShowcase({ config, parts, gsap }) {
    const required = ["body", "antenna", "eyeLeft", "eyeRight", "core"];
    if (!hasParts(parts, required)) return null;
    setInitial(parts, gsap);
    const eyes = [parts.eyeLeft, parts.eyeRight];
    const tl = showcaseTimeline(gsap, config);
    if (!tl) return null;
    tl.to(parts.body, { y: 5, scaleX: 1.08, scaleY: 0.9, duration: 0.18, ease: "power2.in" }, 0)
      .to(parts.body, { y: -7, scaleX: 0.94, scaleY: 1.12, duration: 0.28, ease: "power2.out" }, 0.18)
      .to(parts.body, { y: 0, scaleX: 1, scaleY: 1, duration: 0.34, ease: "bounce.out" }, 0.48)
      .to(parts.antenna, { rotate: -12, duration: 0.16, ease: "power2.inOut" }, 0.06)
      .to(parts.antenna, { rotate: 14, duration: 0.24, ease: "power2.out" }, 0.22)
      .to(parts.antenna, { rotate: 0, duration: 0.32, ease: "power2.inOut" }, 0.52)
      .to(eyes, { scaleY: 0.16, duration: 0.1, ease: "power2.in" }, 0.14)

        "pointer-events": "none",
      });
      const radii = [Math.max(5.2, width * 1.9), Math.max(3.8, width * 1.42), Math.max(2.7, width), Math.max(1.8, width * 0.68)];
      const baseOpacities = mode === "readable" ? [0.82, 0.5, 0.3, 0.16] : [1, 0.62, 0.38, 0.2];
      const parts = radii.map((radius, index) => {
        const part = createSvgElement("circle", {
          class: index === 0 ? "runtime-edge-comet-head" : "runtime-edge-comet-tail",
          cx: "0",
          cy: "0",
          r: radius.toFixed(1),
          fill: stroke,
          stroke: "none",
          opacity: "0",
        });
        comet.appendChild(part);
        return part;
      });
      insertBeforeLabel(group, comet);
      const travel = { progress: 0 };
      const placeComet = () => {
        parts.forEach((part, index) => {
          const local = travel.progress - index * 0.045;
          if (local < 0 || local > 1) {
            part.setAttribute("opacity", "0");
            return;
          }
          const point = base.getPointAtLength(local * length);
          const edgeFade = Math.min(1, local / 0.055, (1 - local) / 0.055);
          part.setAttribute("cx", point.x.toFixed(2));
          part.setAttribute("cy", point.y.toFixed(2));
          part.setAttribute("opacity", Math.max(0, baseOpacities[index] * edgeFade).toFixed(2));
        });
      };
      placeComet();
      timeline = window.gsap.timeline({ repeat: -1, repeatDelay: 0, delay });
      timeline.to(travel, {
        progress: 1,
        duration: Number(entry.duration) || EDGE_COMET_DURATION,
        ease: "none",
        onUpdate: placeComet,
      }, 0);
    } else if (kind === "packet") {
      const packet = createSvgElement("circle", {
        class: "edge-particle runtime-edge-packet edge-motion-v1-generated",
        cx: "0",
        cy: "0",
        r: Math.max(4.8, width * 1.8).toFixed(1),
        fill: stroke,
        stroke: "none",
        opacity: "0",
        "pointer-events": "none",
      });
      insertBeforeLabel(group, packet);
      const travel = { distance: 0 };
      const placePacket = () => {
        const point = base.getPointAtLength(travel.distance);
        packet.setAttribute("cx", point.x.toFixed(2));
        packet.setAttribute("cy", point.y.toFixed(2));
      };
      placePacket();
      const duration = Number(entry.duration) || EDGE_PACKET_DURATION;
      timeline = window.gsap.timeline({ repeat: -1, repeatDelay: 0, delay });
      timeline.to(travel, { distance: length, duration, ease: "none", onUpdate: placePacket }, 0)
        .to(packet, { opacity: mode === "readable" ? 0.78 : 1, duration: 0.12, ease: "power1.out" }, 0)
        .to(packet, { opacity: 0, duration: 0.12, ease: "power1.in" }, duration - 0.12);
    } else {
      return null;
    }
    timeline.__anidiagramStage = "edge-motion";
    timeline.__anidiagramEdgeIndex = entry.index;
    timeline.__anidiagramEdgeEffect = entry.effect;
    timeline.__anidiagramEdgeKind = kind;
    return timeline;
  }

  function play(mode = "expressive") {
    clear();
    const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (mode === "off" || reduced || !manifest.stage || !manifest.stage.edge_flow) return sync([]);
    const indices = mode === "readable"
      ? manifest.stage.readable_edge_indices || []
      : manifest.stage.active_edge_indices || [];
    const groups = Array.from(document.querySelectorAll("#viewport svg g.edge, #stage svg g.edge"));
    const entries = new Map((manifest.edges || []).map((entry) => [entry.index, entry]));
    return sync(indices.map((index) => playEdge(entries.get(index) || {}, groups[index], mode)).filter(Boolean));
  }

  document.addEventListener("click", (event) => {
    if (!event.target.closest || !event.target.closest(".motion-choice")) return;
    manifestElement.textContent = legacyManifestSource;
    setTimeout(() => { manifestElement.textContent = edgeManifestSource; }, 0);
  }, true);

  document.addEventListener("DOMContentLoaded", () => {
    manifestElement.textContent = edgeManifestSource;
    play("expressive");
    document.querySelectorAll(".motion-choice").forEach((button) => {
      button.addEventListener("click", () => play(button.dataset.motion || "expressive"));
    });
  });
  window.AniDiagramEdgeMotion = { play, clear };
})();

  </script>
</body>
