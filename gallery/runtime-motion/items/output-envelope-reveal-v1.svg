<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="diagram-title diagram-desc" data-motion-profile="expressive" data-motion-sequence="simultaneous" data-motion-edge="static" data-motion-node="icon-performance" data-motion-group="static" data-motion-title="none" data-motion-reduced="subtle" data-icon-system="illustrated-character-v1">
<title id="diagram-title">Output Envelope Reveal</title>
<desc id="diagram-desc">output-envelope-reveal-v1</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: round; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .edge-arrow-particle { filter: url(#particle-glow); }
  .semantic-icon { vector-effect: non-scaling-stroke; }
  .semantic-icon-breathe { transform-box: fill-box; transform-origin: center; animation: semanticIconBreathe 2.8s ease-in-out infinite; }
  .icon-breathe-halo { pointer-events: none; filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @keyframes semanticIconBreathe { 0%, 100% { transform: scale(0.96); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight, .semantic-icon-breathe { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#050816" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111c36" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="504" height="308" rx="26" fill="none" stroke="#64748b" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#22d3ee" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#0f2742" />

<text id="main-title" x="90" y="84" class="title" fill="#f8fafc" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.08s" fill="freeze" />
  Output Envelope Reveal
</text>
<text x="74" y="126" class="subtitle" fill="#cbd5e1" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.28s" fill="freeze" />
  output-envelope-reveal-v1
</text>



<g id="node-output" class="node motion-node" data-role="output" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.52s" begin="0.32s" fill="freeze" />



  <rect x="170.0" y="190.0" width="220.0" height="96.0" rx="14.0"
        fill="#052e16" stroke="#4ade80" stroke-width="2.0" />
<g class="semantic-icon-wrap semantic-icon-character-wrap" data-icon="output" data-node-id="output" opacity="0.98">
  <g id="icon-output-root" class="semantic-icon semantic-icon-illustrated-character-v1" data-semantic-role="reveal-deliver-confirm" data-rest-opacity="1" transform="translate(195.0 210.2) scale(0.5568)">
    <g class="illustrated-character-motion-shell">
      <path id="icon-output-envelope" class="illustrated-character-part illustrated-character-envelope" data-rest-opacity="1" d="M19 34h62v42H19z" fill="#83d9ed" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-output-envelope-fold" class="illustrated-character-part illustrated-character-envelope-fold" data-rest-opacity="1" d="M20 36l30 23 30-23M20 75l19-19m42 19L62 56" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <rect id="icon-output-card" class="illustrated-character-part illustrated-character-card" data-rest-opacity="1" x="35" y="22" width="31" height="34" rx="4" fill="#fffdf6" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-output-card-line" class="illustrated-character-part illustrated-character-card-line" data-rest-opacity="1" d="M41 32h18m-18 7h12" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-output-check" class="illustrated-character-part illustrated-character-check" data-rest-opacity="1" d="M43 46l5 5 10-11" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-output-spark" class="illustrated-character-part illustrated-character-spark" data-rest-opacity="1" d="M77 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd45e" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</g>

  <text x="308.0" y="224.0" text-anchor="middle" fill="#f8fafc">
<tspan x="308.0" dy="18" class="node-title">Output</tspan>
<tspan x="308.0" dy="18" class="node-title">Envelope</tspan>
<tspan x="308.0" dy="17" class="node-caption">Reveal /</tspan>
<tspan x="308.0" dy="17" class="node-caption">Deliver /</tspan>
</text>
</g>
</svg>
