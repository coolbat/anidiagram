<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="diagram-title diagram-desc" data-motion-profile="expressive" data-motion-sequence="simultaneous" data-motion-edge="static" data-motion-node="icon-performance" data-motion-group="static" data-motion-title="none" data-motion-reduced="subtle" data-icon-system="semantic-line-v1">
<title id="diagram-title">File Lines</title>
<desc id="diagram-desc">file-lines-v2</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: butt; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .edge-arrow-particle { filter: url(#particle-glow); }
  .semantic-icon { vector-effect: non-scaling-stroke; }
  .semantic-icon-breathe { transform-box: fill-box; transform-origin: center; animation: semanticIconBreathe 2.8s ease-in-out infinite; }
  .icon-breathe-halo { pointer-events: none; filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @keyframes semanticIconBreathe { 0%, 100% { transform: scale(0.96); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight, .semantic-icon-breathe { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#050816" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111c36" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="504" height="308" rx="26" fill="none" stroke="#64748b" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#22d3ee" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#0f2742" />

<text id="main-title" x="90" y="84" class="title" fill="#f8fafc" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.08s" fill="freeze" />
  File Lines
</text>
<text x="74" y="126" class="subtitle" fill="#cbd5e1" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.65s" begin="0.28s" fill="freeze" />
  file-lines-v2
</text>



<g id="node-file" class="node motion-node" data-role="source" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.52s" begin="0.32s" fill="freeze" />



  <rect x="170.0" y="190.0" width="220.0" height="96.0" rx="14.0"
        fill="#071f2f" stroke="#22d3ee" stroke-width="2.0" />

<g id="icon-file-root" class="semantic-icon-wrap semantic-icon-root semantic-icon-file" data-icon="file" data-node-id="file" opacity="0.94">





  <g class="semantic-icon-file-page icon-file-page-motion" opacity="0.96">
      <animateTransform attributeName="transform" type="translate"
        values="-11.3 11.8;3.4 -2.9;0 0;0 0"
        keyTimes="0;0.22;0.34;1" dur="1.85s" begin="0.70s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;1;1;0.92" keyTimes="0;0.14;0.74;1"
        dur="1.85s" begin="0.70s" repeatCount="indefinite" />
    <g transform="translate(212.0 238.0)">
      <g>
          <animateTransform attributeName="transform" type="scale"
            values="0.78;1.22;1;1" keyTimes="0;0.22;0.34;1"
            dur="1.85s" begin="0.70s" repeatCount="indefinite" />
        <g transform="translate(-212.0 -238.0)">
          <path id="icon-file-sheet" class="semantic-icon icon-filled semantic-icon-file icon-file-sheet"
                d="M 196.9 217.0 H 217.9 L 227.1 226.2 V 259.0 H 196.9 Z"
                fill="#0d4759" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          <g id="icon-file-fold" class="icon-file-fold-motion">
      <animateTransform attributeName="transform" type="rotate"
        values="-38 217.9 217.0;0 217.9 217.0;0 217.9 217.0;-16 217.9 217.0;0 217.9 217.0"
        keyTimes="0;0.20;0.64;0.78;1" dur="1.85s" begin="0.76s" repeatCount="indefinite" />
            <path d="M 217.9 217.0 L 227.1 226.2 H 217.9 Z"
                  fill="#12667a" stroke="#22d3ee" stroke-width="2.2" stroke-linejoin="round" />
            <path d="M 217.9 217.0 V 226.2 H 227.1"
                  fill="none" stroke="#22d3ee" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" opacity="0.88" />
          </g>
          <path id="icon-file-line-1" class="icon-runtime-part icon-file-line" d="M 203.2 233.8 H 220.0"
                fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" opacity="0" />
          <path id="icon-file-line-2" class="icon-runtime-part icon-file-line" d="M 203.2 240.5 H 217.9"
                fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" opacity="0" />
          <path id="icon-file-line-3" class="icon-runtime-part icon-file-line" d="M 203.2 247.2 H 215.4"
                fill="none" stroke="#22d3ee" stroke-width="2.2" stroke-linecap="round" opacity="0" />
          <circle id="icon-file-flash" class="icon-runtime-part" cx="215.8" cy="240.1" r="13.0"
                fill="none" stroke="#22d3ee" stroke-width="2" opacity="0" />
        </g>
      </g>
    </g>
  </g>

  <g class="icon-semantic-motion icon-motion-file-lines" data-icon-motion="file-lines">
    <path d="M 203.2 234.2 H 221.2" fill="none" stroke="#22d3ee" stroke-width="2.4"
          stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" opacity="0.76">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.08;0.68;1" dur="1.74s" begin="1.06s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.92;0.92;0" keyTimes="0;0.06;0.66;1" dur="1.74s" begin="1.06s" repeatCount="indefinite" />
    </path>
    <path d="M 203.2 241.8 H 218.7" fill="none" stroke="#22d3ee" stroke-width="2.4"
          stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" opacity="0.76">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.08;0.68;1" dur="1.74s" begin="1.10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.92;0.92;0" keyTimes="0;0.06;0.66;1" dur="1.74s" begin="1.10s" repeatCount="indefinite" />
    </path>
    <path d="M 203.2 248.9 H 216.2" fill="none" stroke="#22d3ee" stroke-width="2.4"
          stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" opacity="0.76">
      <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.08;0.68;1" dur="1.74s" begin="1.15s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.92;0.92;0" keyTimes="0;0.06;0.66;1" dur="1.74s" begin="1.15s" repeatCount="indefinite" />
    </path>
  </g>

</g>

  <text x="308.0" y="224.0" text-anchor="middle" fill="#f8fafc">
<tspan x="308.0" dy="18" class="node-title">File Lines</tspan>
<tspan x="308.0" dy="17" class="node-caption">Document /</tspan>
<tspan x="308.0" dy="17" class="node-caption">Parse / Extract</tspan>
</text>
</g>
</svg>
