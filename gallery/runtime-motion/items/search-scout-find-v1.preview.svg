<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="diagram-title diagram-desc" data-motion-profile="off" data-motion-sequence="simultaneous" data-motion-edge="static" data-motion-node="icon-performance" data-motion-group="static" data-motion-title="none" data-motion-reduced="subtle" data-icon-system="illustrated-character-v1">
<title id="diagram-title">Search Scout Find</title>
<desc id="diagram-desc">search-scout-find-v1</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .edge-flow { stroke-linecap: round; }
  .edge-draw, .edge-base { stroke-linecap: butt; stroke-linejoin: round; }
  .edge-particle { filter: url(#particle-glow); }
  .edge-arrow-particle { filter: url(#particle-glow); }
  .semantic-icon { vector-effect: non-scaling-stroke; }
  .semantic-icon-breathe { transform-box: fill-box; transform-origin: center; animation: semanticIconBreathe 2.8s ease-in-out infinite; }
  .icon-breathe-halo { pointer-events: none; filter: url(#particle-glow); }
  .node-glow, .node-burst { pointer-events: none; }
  #title-accent { transform-origin: 50px 70px; animation: titlePulse 4.8s ease-in-out infinite; }
  #title-highlight { transform-origin: 252px 74px; animation: titleSlide 5.6s ease-in-out infinite; }
  @keyframes titlePulse { 0%, 100% { opacity: 0.76; } 50% { opacity: 1; } }
  @keyframes titleSlide { 0%, 100% { transform: translateX(0); opacity: 0.9; } 50% { transform: translateX(8px); opacity: 1; } }
  @keyframes semanticIconBreathe { 0%, 100% { transform: scale(0.96); opacity: 0.72; } 50% { transform: scale(1.08); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    #title-accent, #title-highlight, .semantic-icon-breathe { animation: none; }
  }
</style>
<rect width="100%" height="100%" fill="#050816" />
<defs>
  <filter id="soft-glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="5" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <filter id="particle-glow" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="2.6" result="blur" />
    <feMerge>
      <feMergeNode in="blur" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111c36" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="504" height="308" rx="26" fill="none" stroke="#64748b" stroke-width="1.4" opacity="1.00" />
<rect id="title-accent" x="44" y="44" width="12" height="52" rx="6" fill="#22d3ee" />
<rect id="title-highlight" x="72" y="46" width="360" height="56" rx="16" fill="#0f2742" />

<text id="main-title" x="90" y="84" class="title" fill="#f8fafc" opacity="1">
  </text>
<text x="74" y="126" class="subtitle" fill="#cbd5e1" opacity="1">
  </text>



<g id="node-search" class="node motion-node" data-role="source" opacity="1">
  <rect x="170.0" y="190.0" width="220.0" height="96.0" rx="14.0" fill="#071f2f" stroke="#22d3ee" stroke-width="2.0" />
<g class="semantic-icon-wrap semantic-icon-character-wrap" data-icon="search" data-node-id="search" opacity="0.98">
  <g id="icon-search-root" class="semantic-icon semantic-icon-illustrated-character-v1" data-semantic-role="scout-scan-find" data-rest-opacity="1" transform="translate(195.0 210.2) scale(0.5568)">
    <g class="illustrated-character-motion-shell">
      <circle id="icon-search-lens" class="illustrated-character-part illustrated-character-lens" data-rest-opacity="1" cx="45" cy="46" r="23" fill="#83d9ed" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-search-lens-shine" class="illustrated-character-part illustrated-character-lens-shine" data-rest-opacity="1" d="M31 40c4-9 13-14 23-12" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-search-scan" class="illustrated-character-part illustrated-character-scan" data-rest-opacity="1" d="M25 46h40" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-search-handle" class="illustrated-character-part illustrated-character-handle" data-rest-opacity="1" d="M61 62l16 16" fill="none" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-search-marker" class="illustrated-character-part illustrated-character-marker" data-rest-opacity="1" d="M45 33c-6 0-10 4-10 10 0 8 10 17 10 17s10-9 10-17c0-6-4-10-10-10z" fill="#ffd2b8" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <circle id="icon-search-marker-dot" class="illustrated-character-part illustrated-character-marker-dot" data-rest-opacity="1" cx="45" cy="43" r="3" fill="#fffdf6" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <path id="icon-search-spark" class="illustrated-character-part illustrated-character-spark" data-rest-opacity="1" d="M77 22l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#ffd45e" stroke="#283047" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</g>

  <text x="308.0" y="224.0" text-anchor="middle" fill="#f8fafc">
<tspan x="308.0" dy="18" class="node-title">Search</tspan>
<tspan x="308.0" dy="18" class="node-title">Scout Find</tspan>
<tspan x="308.0" dy="17" class="node-caption">Scout / Scan /</tspan>
<tspan x="308.0" dy="17" class="node-caption">Find</tspan>
</text>
</g>
<style>
* { animation: none !important; transition: none !important; }
.edge-flow, .edge-particle, .edge-arrow-particle, .node-burst, .node-glow,
.icon-breathe-halo, #title-highlight { display: none !important; }
</style></svg>
