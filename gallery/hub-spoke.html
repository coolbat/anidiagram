<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub-Spoke</title>
  <style>
    body { margin: 0; background: #111827; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; gap: 12px; padding: 16px; box-sizing: border-box; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    button, a { border: 1px solid #475569; background: #1f2937; color: #f8fafc; border-radius: 8px; padding: 8px 10px; font: inherit; text-decoration: none; cursor: pointer; }
    button:hover, a:hover { background: #334155; }
    .stage { width: 100%; min-height: 0; overflow: hidden; border: 1px solid #334155; border-radius: 12px; background: #020617; cursor: grab; }
    .stage.dragging { cursor: grabbing; }
    .viewport { transform-origin: 0 0; width: max-content; }
    svg { display: block; max-width: none; height: auto; user-select: none; }
  </style>
</head>
<body>
  <main>
    <div class="toolbar">
      <button type="button" id="toggle">Pause</button>
      <button type="button" id="zoom-in">Zoom In</button>
      <button type="button" id="zoom-out">Zoom Out</button>
      <button type="button" id="reset">Reset</button>
      <a id="download" download="Hub-Spoke.svg">Download SVG</a>
    </div>
    <div class="stage" id="stage">
      <div class="viewport" id="viewport">
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Hub-Spoke</title>
<desc id="diagram-desc">central coordinator with connected capabilities</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<rect width="100%" height="100%" fill="#050816" />
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111c36" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#64748b" stroke-width="1.4" />
<rect x="44" y="44" width="12" height="52" rx="6" fill="#22d3ee" />
<rect x="72" y="46" width="360" height="56" rx="16" fill="#0f2742" />
<text id="main-title" x="90" y="84" class="title" fill="#f8fafc">Hub-Spoke</text>
<text x="74" y="126" class="subtitle" fill="#cbd5e1">central coordinator with connected capabilities</text>


<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#22d3ee" />
  </marker>
</defs>
<g class="edge" data-role="source">
  <path d="M 520.0 351.0 L 420.0 191.0" fill="none" stroke="#22d3ee" stroke-width="2.4" marker-end="url(#arrow-1)" />
  <circle r="5" fill="#22d3ee">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 520.0 351.0 L 420.0 191.0" begin="0.35s" />
  </circle>

  <text x="470.0" y="257.0" class="edge-label" fill="#cbd5e1">pull</text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#f59e0b" />
  </marker>
</defs>
<g class="edge" data-role="tool">
  <path d="M 680.0 351.0 L 740.0 191.0" fill="none" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#arrow-2)" />
  <circle r="5" fill="#f59e0b">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 680.0 351.0 L 740.0 191.0" begin="0.70s" />
  </circle>

  <text x="710.0" y="257.0" class="edge-label" fill="#cbd5e1">query</text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#34d399" />
  </marker>
</defs>
<g class="edge" data-role="memory">
  <path d="M 520.0 351.0 L 420.0 516.0" fill="none" stroke="#34d399" stroke-width="2.4" marker-end="url(#arrow-3)" />
  <circle r="5" fill="#34d399">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 520.0 351.0 L 420.0 516.0" begin="1.05s" />
  </circle>

  <text x="470.0" y="419.5" class="edge-label" fill="#cbd5e1">store</text>
</g>

<defs>
  <marker id="arrow-4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#fb7185" />
  </marker>
</defs>
<g class="edge" data-role="risk">
  <path d="M 680.0 351.0 L 740.0 516.0" fill="none" stroke="#fb7185" stroke-width="2.4" marker-end="url(#arrow-4)" />
  <circle r="5" fill="#fb7185">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 680.0 351.0 L 740.0 516.0" begin="1.40s" />
  </circle>

  <text x="710.0" y="419.5" class="edge-label" fill="#cbd5e1">check</text>
</g>

<g id="node-hub" class="node" data-role="agent">
  <rect x="520.0" y="310.0" width="160.0" height="82.0" rx="14.0"
        fill="#1e1b4b" stroke="#a78bfa" stroke-width="2.0" />

  <circle cx="538.0" cy="328.0" r="14" fill="#a78bfa" />
  <text x="538.0" y="333.0" class="step-label" fill="#1e1b4b" text-anchor="middle">1</text>
  <text x="600.0" y="337.0" text-anchor="middle" fill="#f8fafc">
<tspan x="600.0" dy="18" class="node-title">Coordinator</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-ingest" class="node" data-role="source">
  <rect x="260.0" y="150.0" width="160.0" height="82.0" rx="14.0"
        fill="#071f2f" stroke="#22d3ee" stroke-width="2.0" />

  <circle cx="278.0" cy="168.0" r="14" fill="#22d3ee" />
  <text x="278.0" y="173.0" class="step-label" fill="#071f2f" text-anchor="middle">2</text>
  <text x="340.0" y="177.0" text-anchor="middle" fill="#f8fafc">
<tspan x="340.0" dy="18" class="node-title">Ingest</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-search" class="node" data-role="tool">
  <rect x="740.0" y="150.0" width="160.0" height="82.0" rx="14.0"
        fill="#21160a" stroke="#f59e0b" stroke-width="2.0" />

  <circle cx="758.0" cy="168.0" r="14" fill="#f59e0b" />
  <text x="758.0" y="173.0" class="step-label" fill="#21160a" text-anchor="middle">3</text>
  <text x="820.0" y="177.0" text-anchor="middle" fill="#f8fafc">
<tspan x="820.0" dy="18" class="node-title">Search</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-memory" class="node" data-role="memory">
  <rect x="260.0" y="475.0" width="160.0" height="82.0" rx="14.0"
        fill="#052e24" stroke="#34d399" stroke-width="2.0" />

  <circle cx="278.0" cy="493.0" r="14" fill="#34d399" />
  <text x="278.0" y="498.0" class="step-label" fill="#052e24" text-anchor="middle">4</text>
  <text x="340.0" y="502.0" text-anchor="middle" fill="#f8fafc">
<tspan x="340.0" dy="18" class="node-title">Memory</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-policy" class="node" data-role="risk">
  <rect x="740.0" y="475.0" width="160.0" height="82.0" rx="14.0"
        fill="#2a0f16" stroke="#fb7185" stroke-width="2.0" />

  <circle cx="758.0" cy="493.0" r="14" fill="#fb7185" />
  <text x="758.0" y="498.0" class="step-label" fill="#2a0f16" text-anchor="middle">5</text>
  <text x="820.0" y="502.0" text-anchor="middle" fill="#f8fafc">
<tspan x="820.0" dy="18" class="node-title">Policy</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>
</svg>

      </div>
    </div>
  </main>
  <script>
    const stage = document.getElementById('stage');
    const viewport = document.getElementById('viewport');
    const svg = viewport.querySelector('svg');
    const download = document.getElementById('download');
    let scale = 1;
    let x = 0;
    let y = 0;
    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    function applyTransform() {
      viewport.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }
    function setDownload() {
      const blob = new Blob([new XMLSerializer().serializeToString(svg)], {type: 'image/svg+xml'});
      download.href = URL.createObjectURL(blob);
    }
    document.getElementById('toggle').addEventListener('click', (event) => {
      if (svg.animationsPaused && svg.animationsPaused()) {
        svg.unpauseAnimations();
        event.currentTarget.textContent = 'Pause';
      } else {
        svg.pauseAnimations();
        event.currentTarget.textContent = 'Play';
      }
    });
    document.getElementById('zoom-in').addEventListener('click', () => { scale = Math.min(3, scale + 0.15); applyTransform(); });
    document.getElementById('zoom-out').addEventListener('click', () => { scale = Math.max(0.35, scale - 0.15); applyTransform(); });
    document.getElementById('reset').addEventListener('click', () => { scale = 1; x = 0; y = 0; applyTransform(); });
    stage.addEventListener('pointerdown', (event) => { dragging = true; stage.classList.add('dragging'); lastX = event.clientX; lastY = event.clientY; stage.setPointerCapture(event.pointerId); });
    stage.addEventListener('pointermove', (event) => {
      if (!dragging) return;
      x += event.clientX - lastX;
      y += event.clientY - lastY;
      lastX = event.clientX;
      lastY = event.clientY;
      applyTransform();
    });
    stage.addEventListener('pointerup', () => { dragging = false; stage.classList.remove('dragging'); });
    setDownload();
  </script>
</body>
</html>
