<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">Sequence</title>
<desc id="diagram-desc">ordered messages between participants</desc>
<style>
  .title { font: 700 42px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 0; }
  .subtitle { font: 400 16px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-title { font: 700 18px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .node-caption { font: 400 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; opacity: 0.84; }
  .group-label { font: 700 14px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-transform: uppercase; letter-spacing: 0.08em; }
  .edge-label { font: 600 13px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .step-label { font: 700 12px ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
</style>
<rect width="100%" height="100%" fill="#ffffff" />
<defs>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#f3f4f6" stroke-width="1" />
  </pattern>
</defs>
<rect width="100%" height="100%" fill="url(#grid)" opacity="0.52" />
<rect x="28" y="26" width="1144" height="668" rx="26" fill="none" stroke="#d1d5db" stroke-width="1.4" />
<rect x="44" y="44" width="12" height="52" rx="6" fill="#111827" />
<rect x="72" y="46" width="360" height="56" rx="16" fill="#f5f5f4" />
<text id="main-title" x="90" y="84" class="title" fill="#1f2937">Sequence</text>
<text x="74" y="126" class="subtitle" fill="#6b7280">ordered messages between participants</text>


<defs>
  <marker id="arrow-1" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#d97706" />
  </marker>
</defs>
<g class="edge" data-role="actor">
  <path d="M 240.0 291.0 L 320.0 291.0" fill="none" stroke="#d97706" stroke-width="2.4" marker-end="url(#arrow-1)" />
  <circle r="5" fill="#d97706">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 240.0 291.0 L 320.0 291.0" begin="0.35s" />
  </circle>

  <circle cx="258.0" cy="272.0" r="14" fill="#d97706" />
  <text x="258.0" y="277.0" class="step-label" fill="#ffffff" text-anchor="middle">1</text>
  <text x="280.0" y="277.0" class="edge-label" fill="#6b7280">submit</text>
</g>

<defs>
  <marker id="arrow-2" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#2563eb" />
  </marker>
</defs>
<g class="edge" data-role="tool">
  <path d="M 480.0 291.0 L 560.0 291.0" fill="none" stroke="#2563eb" stroke-width="2.4" marker-end="url(#arrow-2)" />
  <circle r="5" fill="#2563eb">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 480.0 291.0 L 560.0 291.0" begin="0.70s" />
  </circle>

  <circle cx="498.0" cy="272.0" r="14" fill="#2563eb" />
  <text x="498.0" y="277.0" class="step-label" fill="#ffffff" text-anchor="middle">2</text>
  <text x="520.0" y="277.0" class="edge-label" fill="#6b7280">request</text>
</g>

<defs>
  <marker id="arrow-3" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#15803d" />
  </marker>
</defs>
<g class="edge" data-role="memory">
  <path d="M 720.0 291.0 L 800.0 291.0" fill="none" stroke="#15803d" stroke-width="2.4" marker-end="url(#arrow-3)" />
  <circle r="5" fill="#15803d">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 720.0 291.0 L 800.0 291.0" begin="1.05s" />
  </circle>

  <circle cx="738.0" cy="272.0" r="14" fill="#15803d" />
  <text x="738.0" y="277.0" class="step-label" fill="#ffffff" text-anchor="middle">3</text>
  <text x="760.0" y="277.0" class="edge-label" fill="#6b7280">query</text>
</g>

<defs>
  <marker id="arrow-4" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M 0 0 L 7 3 L 0 6 z" fill="#16a34a" />
  </marker>
</defs>
<g class="edge" data-role="output">
  <path d="M 960.0 291.0 L 960.0 368.5 L 980.0 368.5 L 980.0 446.0" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#arrow-4)" />
  <circle r="5" fill="#16a34a">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M 960.0 291.0 L 960.0 368.5 L 980.0 368.5 L 980.0 446.0" begin="1.40s" />
  </circle>

  <circle cx="948.0" cy="349.5" r="14" fill="#16a34a" />
  <text x="948.0" y="354.5" class="step-label" fill="#ffffff" text-anchor="middle">4</text>
  <text x="970.0" y="354.5" class="edge-label" fill="#6b7280">result</text>
</g>

<g id="node-user" class="node" data-role="actor">
  <rect x="80.0" y="250.0" width="160.0" height="82.0" rx="7.0"
        fill="#fff7ed" stroke="#d97706" stroke-width="1.4" />

  <circle cx="98.0" cy="268.0" r="14" fill="#d97706" />
  <text x="98.0" y="273.0" class="step-label" fill="#fff7ed" text-anchor="middle">1</text>
  <text x="160.0" y="277.0" text-anchor="middle" fill="#1f2937">
<tspan x="160.0" dy="18" class="node-title">User</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-app" class="node" data-role="tool">
  <rect x="320.0" y="250.0" width="160.0" height="82.0" rx="7.0"
        fill="#eff6ff" stroke="#2563eb" stroke-width="1.4" />

  <circle cx="338.0" cy="268.0" r="14" fill="#2563eb" />
  <text x="338.0" y="273.0" class="step-label" fill="#eff6ff" text-anchor="middle">2</text>
  <text x="400.0" y="277.0" text-anchor="middle" fill="#1f2937">
<tspan x="400.0" dy="18" class="node-title">App</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-api" class="node" data-role="process">
  <rect x="560.0" y="250.0" width="160.0" height="82.0" rx="7.0"
        fill="#f9fafb" stroke="#4b5563" stroke-width="1.4" />

  <circle cx="578.0" cy="268.0" r="14" fill="#4b5563" />
  <text x="578.0" y="273.0" class="step-label" fill="#f9fafb" text-anchor="middle">3</text>
  <text x="640.0" y="277.0" text-anchor="middle" fill="#1f2937">
<tspan x="640.0" dy="18" class="node-title">API</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-db" class="node" data-role="memory">
  <rect x="800.0" y="250.0" width="160.0" height="82.0" rx="7.0"
        fill="#f0fdf4" stroke="#15803d" stroke-width="1.4" />

  <circle cx="818.0" cy="268.0" r="14" fill="#15803d" />
  <text x="818.0" y="273.0" class="step-label" fill="#f0fdf4" text-anchor="middle">4</text>
  <text x="880.0" y="277.0" text-anchor="middle" fill="#1f2937">
<tspan x="880.0" dy="18" class="node-title">DB</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>

<g id="node-done" class="node" data-role="output">
  <rect x="980.0" y="405.0" width="160.0" height="82.0" rx="7.0"
        fill="#f0fdf4" stroke="#16a34a" stroke-width="1.4" />

  <circle cx="998.0" cy="423.0" r="14" fill="#16a34a" />
  <text x="998.0" y="428.0" class="step-label" fill="#f0fdf4" text-anchor="middle">5</text>
  <text x="1060.0" y="432.0" text-anchor="middle" fill="#1f2937">
<tspan x="1060.0" dy="18" class="node-title">Done</tspan>
</text>
  <animate attributeName="opacity" values="0.92;1;0.92" dur="3.8s" repeatCount="indefinite" />
</g>
</svg>
